ult 4) |\n| Standard LB SLA | 99.99% |\n| Probe source address | 168.63.129.16 |\n\n| Traffic Manager method | Routes by |\n|---|---|\n| Priority | Primary with failover |\n| Weighted | Percentages |\n| Performance | Lowest latency |\n| Geographic | User location |\n| Multivalue / Subnet | Multiple healthy IPs / client subnet |", "exam": "- Create public and private DNS zones, records and VNet links, and know delegation steps.\n- Know alias records and why a CNAME cannot be at the apex.\n- Build a load balancer (frontend, pool, probe, rule) and choose public vs internal.\n- Troubleshoot unhealthy backends and probe problems.\n- Choose among Load Balancer, Application Gateway, Front Door and Traffic Manager.", "stress": "- **CNAME not allowed at the zone apex.** Use an alias record.\n- **Azure DNS hosts zones; it does not sell domains.** You must delegate NS at the registrar.\n- **Private zone names resolve only from linked VNets.** A VNet can auto-register with only one zone.\n- **LB health probes come from 168.63.129.16.** A custom NSG deny breaks them.\n- **Standard LB is secure by default.** Without an NSG allow rule inbound traffic is dropped.\n- **Backend VMs of a Standard LB must be in the same VNet** (single region).\n- **Load Balancer is layer 4.** Path-based routing or WAF means Application Gateway.\n- **Traffic Manager works at DNS level**; it does not proxy traffic.\n- **Session persistence defaults to none (5-tuple).**", "cues": "### CLI\n```\naz network dns zone create -g rg -n contoso.com\naz network dns record-set a add-record -g rg -z contoso.com -n www --ipv4-address 20.1.2.3\naz network dns record-set cname set-record -g rg -z contoso.com -n blog --cname app.azurewebsites.net\naz network private-dns zone create -g rg -n contoso.internal\naz network private-dns link vnet create -g rg -z contoso.internal -n link1 --virtual-network vnet1 --registration-enabled true\naz network lb create -g rg -n lb1 --sku Standard --public-ip-address pip-lb --frontend-ip-name fe1 --backend-pool-name be1\naz network lb probe create -g rg --lb-name lb1 -n http-probe --protocol Http --port 80 --path /\naz network lb rule create -g rg --lb-name lb1 -n web --protocol Tcp --frontend-port 80 --backend-port 80 --frontend-ip-name fe1 --backend-pool-name be1 --probe-name http-probe\n```\n### PowerShell\n```\nNew-AzDnsZone -Name contoso.com -ResourceGroupName rg\nNew-AzPrivateDnsZone -Name contoso.internal -ResourceGroupName rg\nNew-AzLoadBalancer -ResourceGroupName rg -Name lb1 -Location westeurope -Sku Standard -FrontendIpConfiguration $fe -BackendAddressPool $be -Probe $probe -LoadBalancingRule $rule\n```", "quiz": [{"k": "S", "q": "You need path-based routing (/images and /api) with TLS termination and WAF for a regional web app. Which service?", "o": [{"t": "Azure Load Balancer", "w": "Layer 4 only.", "c": false}, {"t": "Azure Application Gateway", "w": "Layer 7 with WAF and URL routing.", "c": true}, {"t": "Traffic Manager", "w": "DNS-based, does not route paths.", "c": false}, {"t": "Azure DNS", "w": "Name hosting.", "c": false}]}, {"k": "S", "q": "All backend VMs of a Standard load balancer show Unhealthy. The probe is TCP 80 and the app is listening. What is the most likely cause?", "o": [{"t": "The VMs are in an availability set", "w": "Allowed.", "c": false}, {"t": "An NSG rule blocks the AzureLoadBalancer/168.63.129.16 source", "w": "Probes originate there.", "c": true}, {"t": "The LB uses a public IP", "w": "Normal.", "c": false}, {"t": "DNS TTL is too high", "w": "Unrelated.", "c": false}]}, {"k": "M", "q": "Which TWO steps are required so that VMs in VNet1 resolve names in a private DNS zone?", "o": [{"t": "Create a virtual network link between VNet1 and the zone", "w": "Required for resolution.", "c": true}, {"t": "Create the DNS records or enable auto-registration", "w": "Records must exist.", "c": true}, {"t": "Delegate NS records at a registrar", "w": "Public zones only.", "c": false}, {"t": "Assign a public IP to each VM", "w": "Not required.", "c": false}]}, {"k": "D", "q": "To point the apex contoso.com to a Traffic Manager profile use an {0} record. A load balancer with a distribution mode of Client IP provides {1}.", "slots": [[{"t": "CNAME", "w": "Not allowed at apex.", "c": false}, {"t": "alias", "w": "Supports apex.", "c": true}, {"t": "MX", "w": "Mail routing.", "c": false}], [{"t": "session persistence", "w": "Correct.", "c": false}, {"t": "source IP affinity (session persistence)", "w": "2-tuple hash keeps a client on one backend.", "c": true}, {"t": "WAF protection", "w": "An Application Gateway feature.", "c": false}]]}, {"k": "Y", "q": "You create a public Azure DNS zone for contoso.com.", "st": [{"t": "The zone is live for internet users as soon as it is created.", "a": false, "w": "You must delegate NS records at the registrar."}, {"t": "You can create a CNAME record at the apex contoso.com.", "a": false, "w": "Use an alias record."}, {"t": "You can create an alias record pointing to a public IP resource.", "a": true, "w": "Supported."}]}, {"k": "Y", "q": "A public Standard Load Balancer fronts two web VMs with no NSG on the subnet or NICs.", "st": [{"t": "Internet traffic to the frontend is allowed.", "a": false, "w": "Standard is secure by default; an NSG must allow it."}, {"t": "Health probes use source 168.63.129.16.", "a": true, "w": "Fixed platform IP."}, {"t": "The VMs can be in different VNets.", "a": false, "w": "Backend pool resources must be in the same VNet."}]}]}, {"id": "x14", "title": "Monitor resources in Azure", "terms": [["Azure Monitor", "Platform to collect, analyse and act on telemetry from Azure, on-premises and other clouds."], ["Platform metrics", "Numeric time-series data collected automatically for Azure resources (about 1-minute granularity). Stored 93 days."], ["Metrics Explorer", "Chart tool for metrics with aggregation (Avg, Min, Max, Sum, Count), splitting by dimension and filters."], ["Activity log", "Subscription-level control plane events (who created, changed, deleted what, plus service health). Retained 90 days."], ["Resource logs", "Detailed operations inside a resource (for example storage read requests, NSG rule counters). Not collected until you create a diagnostic setting."], ["Diagnostic setting", "Sends platform logs and metrics to a destination: Log Analytics workspace, storage account, Event Hub or partner solution."], ["Log Analytics workspace", "Data store for logs queried with KQL. Default retention 30 days (up to 730 days interactive, longer with archive)."], ["Kusto Query Language (KQL)", "Query language for Log Analytics."], ["Azure Monitor Agent (AMA)", "Agent that collects guest OS logs and metrics from VMs using data collection rules. Replaces the retired Log Analytics (MMA) agent."], ["Data collection rule (DCR)", "Defines what data to collect, how to transform it and where to send it."], ["Alert rule", "Scope + condition + action group + details. Types: metric, log search, activity log."], ["Metric alert", "Fires when a metric crosses a static or dynamic threshold."], ["Log search alert", "Runs a KQL query on a schedule."], ["Activity log alert", "Fires on activity log events (such as VM deleted or service health)."], ["Severity", "0 (critical) to 4 (verbose)."], ["Action group", "Reusable set of notifications (email, SMS, voice, push) and actions (Automation runbook, Function, Logic App, webhook, ITSM, Event Hub)."], ["Alert processing rule", "Modifies alert actions at a scope: suppress during maintenance, or add an action group. Does not stop the alert from firing."], ["VM insights", "Performance charts and Map dependencies for VMs and scale sets. Uses AMA and DCR; Map needs the Dependency agent."], ["Storage insights / Network insights", "Curated monitoring views for storage accounts and network resources."], ["Network Watcher", "Network diagnostics: IP flow verify, next hop, packet capture, topology, VPN diagnostics, flow logs."], ["Connection Monitor", "Continuous connectivity monitoring with latency and reachability between sources and destinations, in Azure and on-premises."]], "fc": [["Platform metric retention", "93 days."], ["Activity log default retention", "90 days."], ["Collect resource logs by", "Creating a diagnostic setting."], ["Agent that replaced MMA", "Azure Monitor Agent with data collection rules."], ["Suppress notifications during maintenance", "Alert processing rule."], ["KQL operator to aggregate", "summarize."], ["Alert severity scale", "0 (critical) to 4 (verbose)."], ["Continuous connectivity monitoring", "Connection Monitor."]], "how": "### Data flows\nSources (resources, guest OS, apps) → **metrics** (automatic) and **logs** (need diagnostic settings or agents) → **Log Analytics** and metrics database → **analyse** (Metrics Explorer, KQL, workbooks) → **act** (alerts, autoscale, runbooks).\n\n### Metrics\n- Platform metrics: CPU percentage, network in/out, disk operations for VMs. No setup.\n- **Guest OS metrics** (memory, disk free) need an agent (AMA with a DCR).\n- Pin charts to a dashboard, set time range, split by dimension, apply filters.\n- Alerting: static threshold or **dynamic threshold** (learns the pattern).\n\n### Logs\n1. Create a **Log Analytics workspace** (same region as data is best for cost).\n2. Create a **diagnostic setting** on each resource (or Azure Policy to deploy at scale), choose categories and destination.\n3. For VMs install **Azure Monitor Agent** and a **DCR** (Windows event logs, Syslog, performance counters).\n4. Choose retention; export to storage for long-term.\n- Activity log: **Export to Log Analytics** with a diagnostic setting for the subscription to keep longer than 90 days.\n\n### Query with KQL\n```\nAzureActivity\n| where TimeGenerated > ago(24h) and OperationNameValue endswith \"DELETE\"\n| summarize count() by Caller\n| order by count_ desc\n\nPerf\n| where ObjectName == \"Processor\" and CounterName == \"% Processor Time\"\n| summarize avg(CounterValue) by Computer, bin(TimeGenerated, 15m)\n| render timechart\n\nHeartbeat | summarize LastBeat = max(TimeGenerated) by Computer | where LastBeat < ago(15m)\n```\nOperators: `where`, `project`, `extend`, `summarize`, `order by`, `top`, `take`, `join`, `bin()`, `ago()`, `render`.\n\n### Alerts\n1. Pick **scope** (resource, RG, subscription).\n2. **Condition** (signal + logic: metric threshold, KQL result count, activity event). Set evaluation frequency and lookback.\n3. **Actions**: attach an action group.\n4. **Details**: name, severity, region, resource group.\n- Alert state: New, Acknowledged, Closed. Monitor condition: Fired or Resolved (stateful alerts auto-resolve).\n- **Alert processing rules** apply planned maintenance suppression or default action groups without editing every rule.\n- Action group limits: SMS 1 per 5 minutes per number, voice 1 per 5 minutes, email 100 per hour per address.\n\n### Insights\n- **VM insights**: Performance tab and Map tab (processes, ports, dependencies).\n- **Storage insights**: capacity, availability, latency per account.\n- **Network insights**: topology and health of network resources, connectivity checks.\n\n### Network Watcher and Connection Monitor\nNetwork Watcher is enabled per region (created automatically with the first VNet in the region, in `NetworkWatcherRG`). **Connection Monitor** probes TCP/ICMP/HTTP between endpoints, charting latency and failures, alerting on thresholds, and can include on-premises with an agent. Use **IP flow verify** for NSG questions and **Next hop** for routing questions.", "lim": "| Item | Value |\n|---|---|\n| Platform metric retention | 93 days |\n| Activity log retention | 90 days |\n| Log Analytics default retention | 30 days (interactive up to 730) |\n| Metric granularity | 1 minute (minimum) |\n| Alert severity | 0 critical to 4 verbose |\n| SMS / voice per number | 1 per 5 minutes |\n| Email per address | 100 per hour |\n\n| Need | Tool |\n|---|---|\n| Chart CPU over time | Metrics Explorer |\n| Find who deleted a VM | Activity log |\n| Query storage read operations | Resource logs via diagnostic setting + KQL |\n| Alert when query returns rows | Log search alert |\n| Mute alerts during a maintenance window | Alert processing rule |\n| Check if VM A can reach VM B on 443 over time | Connection Monitor |\n| Is an NSG blocking this packet? | IP flow verify |", "exam": "- Interpret metrics charts and choose aggregation; configure metric alert thresholds.\n- Create diagnostic settings and choose destinations.\n- Write or read simple KQL queries (where, summarize, bin, ago).\n- Build alert rules, action groups and alert processing rules.\n- Enable VM, storage and network Insights and know prerequisites (AMA, DCR).\n- Use Network Watcher tools and Connection Monitor.", "stress": "- **Resource logs are not collected until a diagnostic setting exists.** Platform metrics are.\n- **Activity log keeps only 90 days** unless exported.\n- **Guest OS memory and disk metrics need an agent.** Host metrics do not include them.\n- **The Log Analytics (MMA) agent is retired;** use Azure Monitor Agent with a DCR.\n- **Alert processing rules suppress or add actions, not the alert itself.** The alert still fires and is recorded.\n- **Action group is separate from the alert rule** and reusable by many rules.\n- **Log search alert** needs the data already in Log Analytics.\n- **Metric alert on a resource in a different region needs a multi-resource rule** only for supported types.\n- **Connection Monitor** = continuous; **Connection troubleshoot** = one-off test.\n- **VM insights Map needs the Dependency agent** in addition to AMA.", "cues": "### Portal\nMonitor > Metrics / Logs / Alerts / Insights. Resource > **Diagnostic settings**. Network Watcher > Connection monitor / IP flow verify.\n### CLI\n```\naz monitor log-analytics workspace create -g rg -n law1 --retention-time 90\naz monitor diagnostic-settings create --name ds1 --resource <resourceId> --workspace law1 --logs '[{\"category\":\"StorageRead\",\"enabled\":true}]' --metrics '[{\"category\":\"Transaction\",\"enabled\":true}]'\naz monitor metrics list --resource <vmId> --metric \"Percentage CPU\" --interval PT5M\naz monitor action-group create -g rg -n ag1 --action email admin admin@contoso.com\naz monitor metrics alert create -g rg -n cpu-high --scopes <vmId> --condition \"avg Percentage CPU > 80\" --window-size 5m --evaluation-frequency 1m --action ag1 --severity 2\naz monitor activity-log list --offset 1d --query \"[?contains(operationName.value,'delete')]\"\naz network watcher test-ip-flow -g rg --vm vm1 --direction Inbound --protocol TCP --local 10.0.1.4:80 --remote 203.0.113.5:50000\n```\n### PowerShell\n```\nNew-AzOperationalInsightsWorkspace -ResourceGroupName rg -Name law1 -Location westeurope -Sku PerGB2018\nSet-AzDiagnosticSetting -ResourceId <id> -WorkspaceId <lawId> -Enabled $true\nGet-AzMetric -ResourceId <id> -MetricName \"Percentage CPU\"\n```", "quiz": [{"k": "S", "q": "You need to keep the subscription activity log for 2 years and query it with KQL. What should you do?", "o": [{"t": "Nothing, retention is 2 years", "w": "Default is 90 days.", "c": false}, {"t": "Create a diagnostic setting sending the Activity log to a Log Analytics workspace with sufficient retention", "w": "Allows long-term retention and KQL.", "c": true}, {"t": "Enable VM insights", "w": "Not related.", "c": false}, {"t": "Configure Metrics Explorer", "w": "Charts metrics only.", "c": false}]}, {"k": "S", "q": "A planned maintenance window will trigger many alerts that notify the on-call team. You want to suppress notifications for the window without deleting rules. What do you use?", "o": [{"t": "Delete the action group", "w": "Removes notifications permanently.", "c": false}, {"t": "An alert processing rule with a schedule", "w": "Suppresses actions during the window.", "c": true}, {"t": "Change severity to 4", "w": "Notifications still sent.", "c": false}, {"t": "Disable diagnostic settings", "w": "Stops data collection.", "c": false}]}, {"k": "M", "q": "Which TWO are required to collect Windows event logs from an Azure VM into Log Analytics?", "o": [{"t": "Azure Monitor Agent installed on the VM", "w": "Collects guest logs.", "c": true}, {"t": "A data collection rule associated with the VM", "w": "Defines what to collect.", "c": true}, {"t": "A resource lock on the VM", "w": "Not relevant.", "c": false}, {"t": "Public IP on the VM", "w": "Not required.", "c": false}]}, {"k": "D", "q": "To see CPU percent per VM over time in a chart you use {0}. To find which user deleted a resource you query the {1}.", "slots": [[{"t": "Metrics Explorer", "w": "Charts metrics.", "c": true}, {"t": "Activity log", "w": "Management events.", "c": false}, {"t": "Connection Monitor", "w": "Connectivity.", "c": false}], [{"t": "platform metrics", "w": "Numeric data.", "c": false}, {"t": "Activity log", "w": "Control plane audit trail.", "c": true}, {"t": "NSG flow logs", "w": "Network flow records.", "c": false}]]}, {"k": "Y", "q": "You create a metric alert for VM CPU above 80 percent and attach an action group that emails admins.", "st": [{"t": "The alert can also call an Azure Automation runbook if the action group includes it.", "a": true, "w": "Action groups support actions."}, {"t": "The same action group can be attached to other alert rules.", "a": true, "w": "Reusable."}, {"t": "Resource logs from the VM host are collected automatically into Log Analytics.", "a": false, "w": "Requires diagnostic settings or agents."}]}, {"k": "O", "q": "Order the steps to send a storage account's blob read logs to Log Analytics.", "steps": ["Create a Log Analytics workspace", "Open the storage account blob service Diagnostic settings", "Select the StorageRead category and the workspace", "Query the StorageBlobLogs table with KQL"], "w": "Resource logs need a diagnostic setting before any data arrives."}]}, {"id": "x15", "title": "Implement backup and recovery", "terms": [["Recovery Services vault", "Vault for Azure Backup (Azure VMs, SQL and SAP HANA in VMs, Azure Files, on-premises via MARS/MABS/DPM) and for Azure Site Recovery."], ["Backup vault", "Newer vault type for Azure Blobs, Azure Disks, PostgreSQL, AKS and other newer workloads."], ["Backup policy", "Schedule plus retention rules for backups (daily or weekly; enhanced policy allows hourly)."], ["Recovery point", "A restorable point in time created by a backup."], ["Instant restore snapshot", "Local snapshot retained 1 to 5 days (default 2) for fast restores."], ["Vault tier", "Backup data copy stored in the vault for long retention."], ["Application-consistent backup", "Captures in-memory data and pending I/O using VSS (Windows). Linux is file-system consistent unless pre/post scripts are used."], ["MARS agent", "Microsoft Azure Recovery Services agent for backing up Windows files, folders and system state to a vault."], ["Azure Backup Server (MABS)", "On-premises backup server that backs up workloads and sends to Azure."], ["Cross Region Restore (CRR)", "Restore from the paired region's replica. Requires a GRS vault."], ["Soft delete (vault)", "Deleted backup data stays 14 days (default) so it can be recovered."], ["Immutable vault / Resource Guard", "Protects backups from tampering; multi-user authorization for critical operations."], ["Azure Site Recovery (ASR)", "Disaster recovery service that replicates VMs to a secondary region (or on-premises to Azure) and orchestrates failover."], ["Mobility service", "Agent that replicates VM data (installed automatically for Azure VMs)."], ["Replication policy", "Recovery point retention (default 24 hours) and app-consistent snapshot frequency (default 4 hours)."], ["Recovery plan", "Ordered failover of groups of VMs with scripts and manual steps."], ["Test failover", "Safe drill in an isolated network with no impact on production or replication."], ["Failover / Commit / Reprotect", "Fail over to the secondary, commit the failover point, then reverse replication to fail back."], ["RPO / RTO", "Recovery point objective (data loss tolerance) and recovery time objective (downtime tolerance)."], ["Backup reports", "Log Analytics-based reports built from diagnostic settings and workbooks."], ["Backup alerts", "Built-in Azure Monitor alerts for backup and restore job failures."]], "fc": [["Vault that protects Azure VMs", "Recovery Services vault in the same region as the VMs."], ["Vault redundancy default", "GRS."], ["Cross Region Restore requires", "GRS redundancy."], ["Vault used for Azure Blobs and disks backup", "Backup vault."], ["Instant restore snapshot retention", "1 to 5 days (default 2)."], ["ASR vault location (Azure to Azure)", "Target region."], ["Safe DR drill", "Test failover into an isolated network."], ["After failover, to fail back", "Reprotect, then fail back."]], "how": "### Vault creation\n- **Recovery Services vault**: Create > Recovery Services vault. Must be in the **same region as the resources it protects** (for Azure VM backup). Set storage redundancy (LRS, ZRS, **GRS default**) **before** protecting items; it cannot be changed after items are registered (GRS to LRS is allowed only before registering).\n- **Backup vault**: same idea for blobs, disks and other supported workloads.\n- Vault properties: soft delete (on by default), immutability, security (Resource Guard), Cross Region Restore (needs GRS).\n\n### Backup policy for Azure VMs\n- Schedule: daily or weekly (enhanced: multiple per day).\n- Retention: daily, weekly, monthly, yearly (up to 9,999 days).\n- Instant restore snapshot retention: 1 to 5 days.\n- Time zone and start time.\n- A policy can be shared across many VMs; changing the policy affects them all.\n\n### Back up and restore\n1. Vault > Backup > workload **Azure Virtual machine** > choose policy > select VMs > **Enable backup**. The backup extension installs automatically; the VM agent must be running.\n2. **Backup now** runs on demand (set \"Retain until\", default 30 days).\n3. Restore options for a VM:\n| Option | Result |\n|---|---|\n| Create new VM | New VM from the recovery point |\n| Restore disks | Disks restored to a storage account; you build the VM from them |\n| Replace existing | Replace the disks of the existing VM |\n| File recovery | Mount recovery point volumes via a script to copy files |\n| Cross Region Restore | Restore to the paired region (GRS vault with CRR) |\n4. **Stop backup**: retain data or delete data. A vault with protected items or soft-deleted data cannot be deleted until cleaned up.\n\n### Files and on-premises\n- **Azure Files** backup uses share snapshots through the vault.\n- **MARS agent** for Windows files, folders and system state. **MABS** or DPM for application workloads.\n\n### Backup monitoring\n- **Backup alerts** are Azure Monitor alerts for failures (on by default for job failures).\n- **Backup reports**: create a diagnostic setting to Log Analytics for the vault, then use the Backup Reports workbook.\n- **Business Continuity Center** (formerly Backup center) gives a single view across vaults and subscriptions.\n\n### Azure Site Recovery (Azure to Azure)\n1. Create a **Recovery Services vault in the target region** (the vault location is where you fail over to).\n2. **Enable replication** for VMs: choose source and target region, target RG, VNet, cache storage account, availability, and **replication policy**.\n3. Optionally build a **recovery plan** (groups, order, scripts, manual actions).\n4. Run **Test failover** regularly into an isolated VNet. Clean up after.\n5. **Failover** (unplanned or planned) → **Commit** → **Reprotect** (reverse replication) → **Failback**.\nASR is for DR (availability of workloads), Azure Backup is for point-in-time data protection. Use both.", "lim": "| Item | Value |\n|---|---|\n| Vault default redundancy | GRS |\n| Vault soft delete | 14 days default |\n| Instant restore snapshots | 1 to 5 days, default 2 |\n| Max backup retention | 9,999 days |\n| ASR recovery point retention | 24 hours default |\n| ASR app-consistent snapshot | Every 4 hours default |\n| On-demand backup default retain | 30 days |\n\n| Service | Purpose | Granularity |\n|---|---|---|\n| Azure Backup | Restore data to a point in time | Recovery points over days to years |\n| Azure Site Recovery | Keep workloads running by failing over | Continuous replication, RPO minutes |", "exam": "- Create the right vault (Recovery Services vs Backup vault) in the correct region.\n- Configure a backup policy (schedule, retention, instant restore).\n- Choose a restore option (new VM, disks, replace, file recovery, cross region).\n- Configure ASR replication, run a test failover, and perform failover and reprotect.\n- Configure and read backup alerts and reports.", "stress": "- **Vault must be in the same region as the VMs** for Azure VM backup. For **ASR the vault is in the target region.**\n- **Storage redundancy cannot change once items are protected.** Choose it first; Cross Region Restore needs GRS.\n- **You cannot delete a vault that still contains backup items or soft-deleted data.** Stop protection and delete the data first.\n- **Test failover does not affect production.** Real failover does, so test first.\n- **Restore disks vs new VM:** restore disks gives you control (for example to change VM config).\n- **File recovery** uses a script that mounts the recovery point; no full VM restore is needed.\n- **Backup reports need Log Analytics diagnostic settings.**\n- **ASR is not a backup**; it replicates current state, so corruption replicates too.\n- **Backup vault ≠ Recovery Services vault.** Azure VMs and Azure Files use the Recovery Services vault; blobs and disks use a Backup vault.\n- **VM agent must be running** or backups fail.", "cues": "### CLI\n```\naz backup vault create -g rg -n rsv1 -l westeurope\naz backup vault backup-properties set -g rg -n rsv1 --backup-storage-redundancy LocallyRedundant\naz backup policy list -g rg -v rsv1 -o table\naz backup protection enable-for-vm -g rg -v rsv1 --vm vm1 --policy-name DefaultPolicy\naz backup protection backup-now -g rg -v rsv1 -c vm1 -i vm1 --backup-management-type AzureIaasVM --retain-until 31-12-2026\naz backup restore restore-disks -g rg -v rsv1 -c vm1 -i vm1 -r <recoveryPointName> --storage-account stdemo\naz backup job list -g rg -v rsv1 -o table\naz dataprotection backup-vault create -g rg --vault-name bv1 -l westeurope --storage-setting \"[{type:LocallyRedundant,datastore-type:VaultStore}]\"\n```\n### PowerShell\n```\nNew-AzRecoveryServicesVault -ResourceGroupName rg -Name rsv1 -Location westeurope\nGet-AzRecoveryServicesVault -Name rsv1 | Set-AzRecoveryServicesVaultContext\n$pol = Get-AzRecoveryServicesBackupProtectionPolicy -Name DefaultPolicy\nEnable-AzRecoveryServicesBackupProtection -ResourceGroupName rg -Name vm1 -Policy $pol\n$item = Get-AzRecoveryServicesBackupItem -BackupManagementType AzureVM -WorkloadType AzureVM -Name vm1\nBackup-AzRecoveryServicesBackupItem -Item $item\n```", "quiz": [{"k": "S", "q": "You need to back up VMs in West Europe and be able to restore them in the paired region if West Europe is unavailable. What should you configure?", "o": [{"t": "A vault with LRS and nothing else", "w": "No regional copy.", "c": false}, {"t": "A Recovery Services vault in West Europe with GRS and Cross Region Restore enabled", "w": "Replica in the paired region for restore.", "c": true}, {"t": "A vault in North Europe with ZRS", "w": "Must match the VM region and ZRS is not geo.", "c": false}, {"t": "Azure Site Recovery without a vault", "w": "ASR needs a vault.", "c": false}]}, {"k": "S", "q": "You want to test your DR plan without impacting production or interrupting replication. What do you run?", "o": [{"t": "A failover", "w": "Affects production.", "c": false}, {"t": "A test failover into an isolated network", "w": "Safe drill.", "c": true}, {"t": "A reprotect", "w": "Reverses replication after a failover.", "c": false}, {"t": "A backup now", "w": "Backup action.", "c": false}]}, {"k": "M", "q": "Which TWO actions are required before you can delete a Recovery Services vault?", "o": [{"t": "Stop protection and delete backup data for all items", "w": "Items must be removed.", "c": true}, {"t": "Remove soft-deleted items or wait for them to be purged", "w": "Soft delete holds data 14 days.", "c": true}, {"t": "Move the vault to another subscription", "w": "Not required.", "c": false}, {"t": "Delete the VMs", "w": "Not required.", "c": false}]}, {"k": "D", "q": "Azure Backup protects data by keeping {0} while Azure Site Recovery provides {1}.", "slots": [[{"t": "recovery points", "w": "Point-in-time copies.", "c": true}, {"t": "continuous replication", "w": "ASR.", "c": false}, {"t": "load balancing", "w": "Unrelated.", "c": false}], [{"t": "recovery points", "w": "Backup.", "c": false}, {"t": "replication and failover", "w": "DR for workloads.", "c": true}, {"t": "file shares", "w": "Azure Files.", "c": false}]]}, {"k": "Y", "q": "You replicate VMs from East US to West US with Site Recovery.", "st": [{"t": "The Recovery Services vault should be created in West US.", "a": true, "w": "The target region."}, {"t": "A test failover interrupts replication.", "a": false, "w": "Replication continues."}, {"t": "Site Recovery can replace the need for backups of data corruption.", "a": false, "w": "Corruption replicates too."}]}, {"k": "O", "q": "Order the steps of Site Recovery failover and failback for an Azure VM.", "steps": ["Run a test failover and clean up", "Fail over to the secondary region", "Commit the failover", "Reprotect and fail back to the primary region"], "w": "Test first, fail over, commit, reprotect, fail back."}]}];
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));

 while(i<L.length){const l=L[i];

/* ---------- QUESTION ENGINE ---------- */
function answered(q,a){if(a==null)return false;switch(q.k){case'S':return a>=0;case'M':return a.length>0;case'D':return q.slots.every((_,i)=>a[i]>=0);case'Y':return q.st.every((_,i)=>a[i]===true||a[i]===false);case'O':return a.length===q.steps.length}return false}
function grade(q,a){switch(q.k){
 case'S':return a!=null&&q.o[a]&&q.o[a].c?1:0;
 case'M':{const c=[];q.o.forEach((o,i)=>{if(o.c)c.push(i)});const x=a||[];return x.length===c.length&&c.every(i=>x.includes(i))?1:0}
 case'D':{let n=0;q.slots.forEach((s,i)=>{if(a&&a[i]>=0&&s[a[i]]&&s[a[i]].c)n++});return n/q.slots.length}
 case'Y':{let n=0;q.st.forEach((s,i)=>{if(a&&a[i]===s.a)n++});return n/q.st.length}
 case'O':return a&&a.length===q.steps.length&&a.every((v,i)=>v===i)?1:0}return 0}
function record(q,f){const s=S.qs[q.id]||(S.qs[q.id]={a:0,c:0});s.a++;if(f===1)s.c++;s.last=f===1;s.ts=Date.now()}

 h+='<div class="qtype">'+TYN[q.k]+(q.k==='M'?' · select '+q.o.filter(o=>o.c).length:'')+'</div>';
 if(q.k==='Y'){const parts=q.q.split(/\n/);h+='<div class="case">'+inline(q.q)+'</div><div class="qtext">For each statement, select Yes if it is true.</div>'}else if(q.k!=='D')h+='<div class="qtext">'+inline(q.q)+'</div>';
 if(q.k==='S'||q.k==='M'){h+=q.o.map((o,i)=>{const sel=q.k==='S'?a===i:(a||[]).includes(i);let c='opt '+(q.k==='M'?'m ':'')+(sel?'sel ':'');if(show){if(o.c)c+='ok ';else if(sel)c+='no '}
  return '<button class="'+c+'" data-act="pick" data-i="'+i+'" '+(show?'disabled':'')+'><span class="l">'+(show&&o.c?'✓':show&&sel?'✕':L[i])+'</span><span class="x">'+inline(o.t)+(show&&o.w?'<span class="why">'+(o.c?'Why it is right: ':'Why it is wrong: ')+inline(o.w)+'</span>':'')+'</span></button>'}).join('')}
 if(q.k==='D'){let t=inline(q.q).replace(/\{(\d+)\}/g,(m,n)=>{n=+n;const s=q.slots[n],v=a?a[n]:undefined;let c='';if(show)c=(v>=0&&s[v]&&s[v].c)?'ok':'no';return '<select data-act="dd" data-n="'+n+'" class="'+c+'" '+(show?'disabled':'')+' aria-label="Choice '+(n+1)+'"><option value="-1">Select…</option>'+s.map((o,i)=>'<option value="'+i+'" '+(v===i?'selected':'')+'>'+inline(o.t).replace(/<[^>]+>/g,'')+'</option>').join('')+'</select>'});h+='<div class="qtext dd" style="line-height:2.2">'+t+'</div>';
  if(show)h+=q.slots.map((s,n)=>'<div class="card small"><b>Box '+(n+1)+'</b>'+s.map(o=>'<div style="margin-top:6px">'+(o.c?'✓ ':'✕ ')+'<b>'+inline(o.t)+'</b><span class="why">'+inline(o.w)+'</span></div>').join('')+'</div>').join('')}

  if(show)h+='<div class="card small"><b>Correct order</b><ol style="padding-left:20px;margin:6px 0">'+q.steps.map(s=>'<li>'+inline(s)+'</li>').join('')+'</ol>'+(q.w?'<div class="why">'+inline(q.w)+'</div>':'')+'</div>'}

function preHTML(){const s=SS,un=s.qs.filter((q,i)=>!answered(q,s.ans[i])).length,fl=Object.keys(s.flag).filter(k=>s.flag[k]).length;
 return '<div class="shead"><button class="icon-btn" data-act="sback" aria-label="Back">←</button><div class="stitle">Review &amp; submit<small>'+un+' unanswered · '+fl+' flagged</small></div><div class="timer" id="timer">…</div></div><div class="sbody"><div class="sin"><div class="pal">'+s.qs.map((q,i)=>'<button class="'+(answered(q,s.ans[i])?'a ':'')+(s.flag[i]?'fl':'')+'" data-act="sjump" data-i="'+i+'">'+(i+1)+'</button>').join('')+'</div><p class="small muted">Filled = answered. ⚑ = flagged. Tap a number to jump back.</p></div></div><div class="sfoot"><div class="in"><button class="btn" data-act="sback">Keep working</button><button class="btn pri" data-act="msub">'+(s.conf?'Tap again to submit':'Submit exam')+'</button></div></div>'}
function ring(p,col){const r=62,c=2*Math.PI*r;return '<svg class="ring" viewBox="0 0 150 150" role="img" aria-label="'+p+' percent"><circle cx="75" cy="75" r="'+r+'" fill="none" stroke="var(--surface2)" stroke-width="12"/><circle cx="75" cy="75" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(c*p/100)+' '+c+'" transform="rotate(-90 75 75)"/><text x="75" y="85" text-anchor="middle">'+p+'%</text></svg>'}
function resultHTML(){const s=SS,r=s.result;let h='<div class="shead"><button class="icon-btn" data-act="sclose" aria-label="Close">✕</button><div class="stitle">'+esc(s.title)+'<small>Results</small></div></div><div class="sbody"><div class="sin fade"><div class="card" style="text-align:center">'+ring(r.pct,r.pass?'var(--good)':'var(--brand)')+
 '<h2 style="margin-top:8px">'+(s.kind==='mock'?(r.pass?'Pass-level score':'Below the 70% pass mark'):(r.pct===100?'Perfect round':r.pct>=70?'Solid work':'Keep drilling'))+'</h2><p class="muted small">'+r.full+' of '+s.qs.length+' fully correct'+(s.kind==='mock'?' · time used '+Math.round((Date.now()-s.t0)/60000)+' min':'')+'</p></div>';
 if(r.by)h+='<div class="card"><b>Score by domain</b>'+r.by.map(b=>'<div class="dbar"><div class="lb"><span>'+esc(b.n)+'</span><span>'+(b.cnt?b.p+'% ('+b.ok+'/'+b.cnt+')':'no items')+'</span></div><div class="bar thick '+(b.p<70?'amber':'')+'"><i style="width:'+b.p+'%"></i></div></div>').join('')+'</div>';
 const miss=s.qs.map((q,i)=>i).filter(i=>grade(s.qs[i],s.ans[i])<1);
 if(miss.length)h+='<div class="card"><b>Topics to revise</b>'+[...new Set(miss.map(i=>s.qs[i].topic))].map(t=>'<div class="row" style="padding:6px 0"><span class="grow small">'+inline(TOP[t].title)+'</span><button class="chip" data-act="goto" data-t="'+t+'">Read</button></div>').join('')+'</div>';
 return h+'</div></div><div class="sfoot"><div class="in"><button class="btn" data-act="srev" data-m="all">Review all</button>'+(miss.length?'<button class="btn" data-act="srev" data-m="miss">Review missed</button>':'')+'<button class="btn pri" data-act="sclose">Done</button></div></div>'}
function finishSession(){const s=SS;let tot=0,full=0;s.qs.forEach((q,i)=>{const f=grade(q,s.ans[i]);tot+=f;if(f===1)full++});const p=Math.round(tot/s.qs.length*100);
 s.result={pct:p,full,pass:p>=70};s.phase='result';S.hist.push({ts:Date.now(),title:s.title,pct:p,kind:s.kind,n:s.qs.length});touch();save();
 if(s.kind==='topic'&&p===100)celebrate('💯 Perfect score on '+s.title);renderSess(false)}
function submitMock(auto){const s=SS;if(!s||s.phase==='result')return;clearInterval(tick);const E=OUT[S.exam];let tot=0,full=0;const by=E.domains.map(d=>({n:d.n,sum:0,cnt:0,ok:0}));
 s.qs.forEach((q,i)=>{const f=grade(q,s.ans[i]);tot+=f;if(f===1)full++;record(q,f);by[q.d].sum+=f;by[q.d].cnt++;if(f===1)by[q.d].ok++});
 by.forEach(b=>b.p=b.cnt?Math.round(b.sum/b.cnt*100):0);const p=Math.round(tot/s.qs.length*100);
 s.result={pct:p,full,pass:p>=70,by};s.phase='result';S.mocks.push({ts:Date.now(),ex:S.exam,pct:p,pass:p>=70,by:by.map(b=>({p:b.p}))});S.hist.push({ts:Date.now(),title:'Mock '+E.code,pct:p,kind:'mock',n:s.qs.length});touch();save();
 if(p>=70&&!S.ms.mock){S.ms.mock=1;celebrate('🏆 Mock exam passed at '+p+'%')}if(auto)toast('Time is up. Exam submitted.');renderSess(false)}

/* ---------- actions ---------- */
function setObj(id,v){if(v)S.obj[id]=v;else delete S.obj[id]}
function patchObj(id){$$('[data-o="'+id+'"] .st').forEach(b=>{b.dataset.v=val(id);b.textContent=stLab[val(id)]});$$('[data-m="'+id+'"]').forEach(i=>i.className=val(id)===2?'c':val(id)===1?'l':'')}
function copyText(txt,btn){const done=()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy',1400)};
 try{navigator.clipboard.writeText(txt).then(done,()=>fallback())}catch(e){fallback()}
 function fallback(){const r=document.createRange();const pre=btn.nextElementSibling;r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Selected'}}
const A={
 theme(){S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme];applyTheme();save()},
 exam(el){S.exam=el.dataset.ex;F.run=null;save();render()},
 tab(el){tab=el.dataset.t;location.hash=tab;render();scrollTo(0,0)},
 weak(){WEAK=!WEAK;$('#wk').classList.toggle('on',WEAK);$('#list').innerHTML=listHTML()},
 obj(el){const id=el.dataset.id;setObj(id,(val(id)+1)%3);patchObj(id);touch();checkMilestones();renderHdr();const d=el.closest('details.topic');if(d){const t=TOP[d.dataset.t],ids=OBJ[t.ex].top[t.id],s=$('details.sec:last-of-type',d);}
  $$('details.sec>summary span').forEach(sp=>{const m=sp.textContent.match(/^Objectives checklist/);if(m){const t=TOP[(sp.closest('details.topic')||{dataset:{}}).dataset.t];if(t){const ids=OBJ[t.ex].top[t.id];sp.textContent='Objectives checklist ('+conf(ids)+'/'+ids.length+')'}}})},
 tall(el){const t=TOP[el.dataset.t],v=+el.dataset.v;OBJ[t.ex].top[t.id].forEach(id=>{setObj(id,v);patchObj(id)});touch();checkMilestones();renderHdr();toast(v===2?'Topic marked confident':v===1?'Topic marked learning':'Topic reset')},
 tquiz(el){const t=TOP[el.dataset.t];startSession({kind:'topic',title:t.title,qs:t.quiz})},
 copy(el){copyText(el.nextElementSibling.textContent,el)},
 goto(el){const t=TOP[el.dataset.t];if(SS)closeSession();S.exam=t.ex;Q='';WEAK=false;S.open['t'+t.id]=true;S.open['d'+t.ex+t.d]=true;save();tab='learn';location.hash='learn';render();const e=$('[data-t="'+t.id+'"]');if(e)e.scrollIntoView({block:'start'})},
 tweak(el){const t=TOP[el.dataset.t];const qs=t.quiz.filter(wrongQ);startSession({kind:'practice',title:'Drill: '+t.title,qs:qs.length?qs:t.quiz})},
 /* flashcards */
 ff(el){F.f=el.dataset.v;render()},fshuf(){F.shuf=!F.shuf;render()},
 fcgo(){let q=cardPool();if(F.shuf)q=shuffle(q);F.run={q,pos:0,flip:false,k:0,r:0};render()},
 fcend(){F.run=null;render()},
 flip(){const r=F.run;r.flip=!r.flip;$('#fci').classList.toggle('flip',r.flip)},
 fcm(el){const r=F.run,c=r.q[r.pos];S.fc[c.id]=el.dataset.v;if(el.dataset.v==='known')r.k++;else r.r++;r.pos++;r.flip=false;touch();render()},
 fcprev(){const r=F.run;if(r.pos>0){r.pos--;r.flip=false;render()}},fcskip(){const r=F.run;r.pos++;r.flip=false;render()},
 /* practice */
 pty(el){const k=el.dataset.v,i=P.types.indexOf(k);if(i>=0){if(P.types.length>1)P.types.splice(i,1)}else P.types.push(k);render()},
 pn(el){P.n=+el.dataset.v;render()},pweak(){P.weak=!P.weak;render()},
 pgo(){const pool=shuffle(practicePool()).slice(0,P.n);startSession({kind:'practice',title:'Practice · '+OUT[S.exam].code,qs:pool})},
 mgo(){const sp=mockSpec(S.exam);startSession({kind:'mock',title:'Mock exam · '+OUT[S.exam].code,qs:buildMock(),minutes:sp.min})},
 /* session */
 sclose(){if(SS&&SS.kind==='mock'&&SS.phase==='run'&&!SS.conf){SS.conf=true;toast('Tap ✕ again to abandon the exam');return}closeSession()},
 pick(el){const s=SS,qi=s.view[s.i],q=s.qs[qi],i=+el.dataset.i;if(s.chk[qi]||s.phase==='review')return;if(q.k==='S')s.ans[qi]=i;else{const a=s.ans[qi]||[],p=a.indexOf(i);if(p>=0)a.splice(p,1);else a.push(i);s.ans[qi]=a}renderSess(true)},
 yn(el){const s=SS,qi=s.view[s.i];if(s.chk[qi]||s.phase==='review')return;const a=s.ans[qi]||(s.ans[qi]=[]);a[+el.dataset.n]=el.dataset.v==='true';renderSess(true)},
 oadd(el){const s=SS,qi=s.view[s.i];(s.ans[qi]||(s.ans[qi]=[])).push(+el.dataset.i);renderSess(true)},
 oremove(el){const s=SS,qi=s.view[s.i],a=s.ans[qi]||[];a.splice(a.indexOf(+el.dataset.i),1);renderSess(true)},
 scheck(){const s=SS,qi=s.view[s.i],q=s.qs[qi];if(!answered(q,s.ans[qi])){toast('Answer every part first');return}s.chk[qi]=true;const f=grade(q,s.ans[qi]);record(q,f);touch();renderSess(true);const v=$('.verdict');if(v)v.scrollIntoView({block:'nearest',behavior:'smooth'})},
 snext(){if(SS.i<SS.view.length-1){SS.i++;renderSess(false)}},sprev(){if(SS.i>0){SS.i--;renderSess(false)}},
 sflag(){const qi=SS.view[SS.i];SS.flag[qi]=!SS.flag[qi];renderSess(true)},
 spre(){SS.phase='pre';SS.conf=false;renderSess(false)},sback(){SS.phase='run';renderSess(false)},sjump(el){SS.i=+el.dataset.i;SS.phase='run';renderSess(false)},
 msub(){if(!SS.conf){SS.conf=true;renderSess(false);return}submitMock(false)},
 sfin(){finishSession()},sres(){SS.phase='result';renderSess(false)},
 srev(el){const s=SS;s.view=el.dataset.m==='miss'?s.qs.map((q,i)=>i).filter(i=>grade(s.qs[i],s.ans[i])<1):s.qs.map((q,i)=>i);s.i=0;s.phase='review';renderSess(false)},
 /* track */
 bkx(){$('#bk').value=JSON.stringify(S);$('#bk').select();toast('Backup created. Copy the text and keep it safe.')},
 bki(){try{const o=JSON.parse($('#bk').value);if(!o||typeof o!=='object'||!o.obj)throw 0;S=Object.assign(def(),o);save();applyTheme();render();toast('Progress restored')}catch(e){toast('That text is not a valid backup')}},
 reset(el){if(!el.dataset.c){el.dataset.c=1;el.textContent='Tap again to erase all progress';setTimeout(()=>{el.dataset.c='';el.textContent='Reset all progress'},3500);return}S=def();save();applyTheme();render();toast('Progress cleared')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT')return;const f=A[el.dataset.act];if(f){f(el,e)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc')){e.preventDefault();A.flip()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='fd'){F.d=t.value;render()}
 else if(t.id==='ps'){P.scope=t.value;render()}
 else if(t.id==='exd'){S.date=t.value;save();render()}
 else if(t.dataset&&t.dataset.act==='dd'){const s=SS,qi=s.view[s.i],q=s.qs[qi],a=s.ans[qi]||(s.ans[qi]=q.slots.map(()=>-1));a[+t.dataset.n]=+t.value;}});
document.addEventListener('input',e=>{if(e.target.id==='qs'){Q=e.target.value;$('#list').innerHTML=listHTML()}});
document.addEventListener('toggle',e=>{const d=e.target;if(!d.matches||!d.matches('details[data-k]'))return;S.open[d.dataset.k]=d.open;save();
 if(d.classList.contains('topic')&&d.open){const b=$('.tb',d);if(b&&!b.firstChild)b.innerHTML=tbHTML(TOP[d.dataset.t])}},true);
addEventListener('hashchange',()=>{const t=(location.hash||'#learn').slice(1);if(TABS.some(x=>x[0]===t)&&t!==tab){tab=t;render()}});
applyTheme();render();renderCloudUI();initCloud();
document.addEventListener('click',e=>{
  if(e.target.closest('#cloudLogin'))sendCloudMagicLink();
  else if(e.target.closest('#cloudLogout'))signOutCloud();
  else if(e.target.closest('#cloudSyncNow'))pushCloudState();
});
})();
</script>

</body></html>
