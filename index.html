ction).", "stress": "- **Authentication = who you are. Authorization = what you can do.** Entra ID authenticates; RBAC authorizes on Azure resources.\n- **Entra Domain Services is for legacy domain-join and Kerberos/LDAP needs**, not for new cloud-native apps.\n- **Contributor cannot assign roles.** Owner can.\n- **Conditional Access needs P1.** Policies are applied after the first factor.\n- **Zero Trust has three principles**: verify explicitly, least privilege, assume breach.\n- **Defense in depth is layers, not a single product.**\n- **Defender for Cloud** is posture plus protection, not a firewall.", "cues": "", "quiz": [{"k": "S", "q": "A legacy app needs Kerberos and domain join but you do not want to manage domain controllers in Azure. What should you use?", "o": [{"t": "Microsoft Entra ID", "w": "Does not offer Kerberos domain join the legacy way.", "c": false}, {"t": "Microsoft Entra Domain Services", "w": "Managed AD DS with domain join, LDAP and Kerberos.", "c": true}, {"t": "Azure Policy", "w": "Governance tool.", "c": false}, {"t": "Azure Bastion", "w": "Secure RDP/SSH access, not directory services.", "c": false}]}, {"k": "S", "q": "Which role can manage Azure resources but cannot assign roles to others?", "o": [{"t": "Owner", "w": "Can assign roles.", "c": false}, {"t": "Contributor", "w": "Full resource management without role assignment.", "c": true}, {"t": "Reader", "w": "Cannot manage resources.", "c": false}, {"t": "User Access Administrator", "w": "Manages access, not resources.", "c": false}]}, {"k": "M", "q": "Which TWO are Zero Trust principles?", "o": [{"t": "Verify explicitly", "w": "Always authenticate and authorize using all signals.", "c": true}, {"t": "Use least privilege access", "w": "Limit access to what is needed.", "c": true}, {"t": "Trust the corporate network", "w": "The opposite of Zero Trust.", "c": false}, {"t": "Assume the perimeter is secure", "w": "The model assumes breach.", "c": false}]}, {"k": "D", "q": "Requiring MFA when a user signs in from outside the country is configured with {0}. Granting a user read-only access to a resource group uses {1}.", "slots": [[{"t": "Azure RBAC", "w": "Authorization on Azure resources.", "c": false}, {"t": "Conditional Access", "w": "If-then sign-in policy.", "c": true}, {"t": "Azure Policy", "w": "Evaluates resource compliance.", "c": false}], [{"t": "Conditional Access", "w": "Controls sign-in, not resource permissions.", "c": false}, {"t": "Azure RBAC with the Reader role", "w": "Role at the resource group scope.", "c": true}, {"t": "Microsoft Entra Domain Services", "w": "Not an authorization tool for Azure resources.", "c": false}]]}, {"k": "Y", "q": "A partner company needs to use an internal app.", "st": [{"t": "You can invite partner users as guest users using their own credentials.", "a": true, "w": "B2B external identities."}, {"t": "Conditional Access policies can require MFA for guests.", "a": true, "w": "Policies can target guest users."}, {"t": "Defender for Cloud is used to configure sign-in policies.", "a": false, "w": "It assesses security posture; sign-in policies are Conditional Access."}]}]}, {"id": "f08", "title": "Describe cost management in Azure", "terms": [["Pricing calculator", "Free web tool to estimate the monthly cost of Azure services you plan to use. Works before you deploy anything."], ["Total Cost of Ownership (TCO) calculator", "Compares the cost of running workloads on-premises with the cost on Azure over several years."], ["Microsoft Cost Management", "Azure tooling to analyse, budget, alert on and optimise spend (part of Cost Management + Billing)."], ["Cost analysis", "View of actual costs grouped by resource, resource group, tag, service, location and more."], ["Budget", "A spending threshold for a scope with alerts at percentages. It alerts, it does not stop resources."], ["Cost alert", "Notification for budgets, credits, anomalies or department spending."], ["Tag", "A name/value pair attached to a resource, resource group or subscription for organisation and cost allocation (for example `CostCenter=1234`)."], ["Azure free account", "Includes a credit (about $200) for 30 days, 12 months of selected free services, and always-free services."], ["Egress", "Outbound data transfer from Azure. Billed. Inbound data is free."], ["Azure Reservations", "Discounted pricing for 1 or 3 year commitments on VMs, SQL, storage and more."], ["Azure Hybrid Benefit", "Reuse existing licenses to reduce price."], ["Spot pricing", "Deep discount for evictable capacity."], ["Azure Advisor cost recommendations", "Suggestions such as shutting down idle VMs, right-sizing, buying reservations."], ["Right-sizing", "Choosing a smaller, cheaper VM size that still meets real usage."]], "fc": [["Inbound data transfer cost", "Free. Outbound (egress) is charged."], ["Tool to estimate planned Azure costs", "Pricing calculator."], ["Tool to compare on-premises to Azure", "TCO calculator."], ["Budgets do what?", "Send alerts at thresholds. They do not stop resources."], ["Max tags per resource", "50."], ["Do tags inherit from resource group?", "No, not by default."], ["Tool for cost-saving recommendations", "Azure Advisor (cost category)."]], "how": "### What affects cost\n| Factor | Why it matters |\n|---|---|\n| Resource type and size/tier | A bigger SKU or premium tier costs more |\n| Consumption | You pay for what you use (hours, GB, executions) |\n| Region (location) | Prices differ by region |\n| Bandwidth | Outbound data is billed, inbound is free; cross-region and cross-zone traffic may cost |\n| Maintenance and support | Support plans and management add cost |\n| Subscription type | Free, pay-as-you-go, enterprise agreement, Azure Marketplace products |\n| Licensing | Windows and SQL licensing; Hybrid Benefit lowers it |\n\n### Estimating (before you deploy)\nUse the **pricing calculator** to build an estimate. Use the **TCO calculator** to justify moving from on-premises.\n\n### Controlling (after you deploy)\n**Cost Management** gives cost analysis, budgets, alerts, exports and recommendations. **Azure Advisor** adds cost-saving advice. **Tags** let you attribute cost to teams and projects.\n\n### Tags\n- Up to 50 tag pairs per resource.\n- Tags are **not inherited** from resource group to resources by default. Use Azure Policy to enforce or inherit.\n- Tags appear in cost analysis so you can group by `Department` or `Project`.", "lim": "| Tool | Phase | Answer it gives |\n|---|---|---|\n| Pricing calculator | Before | What will my planned resources cost? |\n| TCO calculator | Before | Is Azure cheaper than my datacenter? |\n| Cost analysis | After | Where is my money going? |\n| Budgets and alerts | After | Warn me when spending passes a threshold |\n| Advisor cost recommendations | After | How do I save money? |", "exam": "- Name factors that affect cost (resource type, region, bandwidth, consumption, subscription type).\n- Use the correct tool: pricing calculator to estimate, Cost Management to analyse and alert.\n- Describe the purpose of tags (organisation, cost allocation).\n- Recognise ways to reduce cost: reservations, Hybrid Benefit, Spot, right-sizing, deallocating.", "stress": "- **Budgets alert; they do not stop spending.** An action group can automate a response, but a budget alone never shuts a resource down.\n- **Inbound traffic is free, outbound is charged.**\n- **Pricing calculator = estimate. Cost analysis = actuals.** TCO = compare to on-premises.\n- **Tags are not inherited** automatically.\n- A deallocated VM stops compute charges but disks and public IPs may still bill.\n- **Region changes price.** The cheapest region may violate data residency.", "cues": "", "quiz": [{"k": "S", "q": "You want to know the estimated monthly cost of a planned deployment before creating anything. Which tool?", "o": [{"t": "Pricing calculator", "w": "Builds estimates for planned services.", "c": true}, {"t": "Cost analysis", "w": "Shows costs of resources that already exist.", "c": false}, {"t": "Azure Service Health", "w": "Reports platform incidents.", "c": false}, {"t": "Azure Policy", "w": "Governance, not cost estimates.", "c": false}]}, {"k": "S", "q": "A team wants to see cost per department across many resource groups. What should be applied?", "o": [{"t": "Resource locks", "w": "Prevent changes, not group cost.", "c": false}, {"t": "Tags such as Department=Finance", "w": "Tags can be used to group costs in cost analysis.", "c": true}, {"t": "Management groups only", "w": "Do not by themselves provide a department dimension.", "c": false}, {"t": "Availability zones", "w": "Resilience feature.", "c": false}]}, {"k": "M", "q": "Which TWO actions can reduce Azure compute cost?", "o": [{"t": "Purchase reserved instances for steady workloads", "w": "Discounts for commitment.", "c": true}, {"t": "Right-size or deallocate idle VMs", "w": "Pay for what you need.", "c": true}, {"t": "Move more data out of Azure to other clouds", "w": "Egress is billed.", "c": false}, {"t": "Use only the Premium tier everywhere", "w": "Higher price.", "c": false}]}, {"k": "D", "q": "Setting a spending threshold that emails you at 80 percent is done with a {0}. This {1} stop resources automatically.", "slots": [[{"t": "budget", "w": "Budgets define thresholds and alert rules.", "c": true}, {"t": "resource lock", "w": "Prevents delete or modification.", "c": false}, {"t": "policy initiative", "w": "Governance.", "c": false}], [{"t": "does", "w": "Budgets do not shut down resources.", "c": false}, {"t": "does not", "w": "They only notify unless you wire up automation.", "c": true}]]}, {"k": "Y", "q": "Contoso is planning a migration.", "st": [{"t": "The TCO calculator can compare on-premises costs with Azure costs.", "a": true, "w": "That is its purpose."}, {"t": "Inbound data transfer to Azure is billed per GB.", "a": false, "w": "Inbound transfer is free."}, {"t": "Tags applied to a resource group automatically apply to its resources.", "a": false, "w": "Tags are not inherited by default."}]}]}, {"id": "f09", "title": "Describe features and tools in Azure for governance and compliance", "terms": [["Governance", "The controls that keep cloud usage consistent with organisational rules (policy, access, tags, locks, compliance)."], ["Microsoft Purview", "Portfolio of data governance, risk and compliance solutions: discover and classify data across on-premises, multicloud and SaaS, apply sensitivity labels, data loss prevention (DLP), insider risk and eDiscovery."], ["Data governance", "Knowing what data you have, where it is, how sensitive it is and who can use it."], ["Sensitivity label", "A classification tag (such as Confidential) that can encrypt and restrict content."], ["Azure Policy", "Service that creates, assigns and manages rules (policy definitions) to enforce standards and assess compliance of Azure resources."], ["Policy definition", "One rule, for example \"allowed locations\"."], ["Initiative (policy set)", "A group of related policy definitions assigned together."], ["Policy effect", "What happens on non-compliance: Deny, Audit, Append, Modify, DeployIfNotExists and others."], ["Remediation task", "Brings existing non-compliant resources into compliance (for DeployIfNotExists and Modify)."], ["Resource lock", "Prevents accidental deletion or modification of a resource, resource group or subscription."], ["CanNotDelete lock", "Authorised users can read and modify but cannot delete."], ["ReadOnly lock", "Authorised users can only read. No modify or delete."], ["Service Trust Portal", "Microsoft's portal for audit reports and compliance documentation."], ["Compliance", "Meeting laws, regulations and standards (ISO 27001, GDPR, HIPAA, SOC)."]], "fc": [["Azure Policy purpose", "Enforce organisational standards and assess compliance of resources."], ["Lock types", "CanNotDelete and ReadOnly."], ["Does a lock override Owner?", "Yes. The lock must be removed first."], ["Initiative", "A collection of policy definitions assigned together."], ["Purview purpose", "Data governance, classification and compliance across your data estate."], ["Policy tool for blocking a region", "Azure Policy with an allowed locations definition (Deny effect)."]], "how": "### Azure Policy vs RBAC vs locks\n- **RBAC** answers: who can do what? (user permissions)\n- **Policy** answers: what is allowed to exist? (resource rules, evaluated on resources)\n- **Locks** answer: can this be changed or deleted at all? (protection, overrides RBAC)\n\n### How Azure Policy works\n1. A **definition** describes a condition and an effect.\n2. You **assign** it (or an initiative) to a scope (management group, subscription, resource group).\n3. Azure evaluates new and existing resources. Non-compliant resources are flagged. With **Deny**, creation or change is blocked; with **DeployIfNotExists** a remediation task can fix existing resources.\nTypical policies: allowed regions, allowed VM SKUs, require a tag, require encryption, restrict public IPs.\n\n### Resource locks\nApply at subscription, resource group or resource. Locks are **inherited** by child resources. Even an **Owner** is blocked until the lock is removed. Two types: CanNotDelete and ReadOnly.\n\n### Microsoft Purview\nThink **data**, not infrastructure. It maps your data estate, classifies sensitive data, applies labels, helps with data loss prevention and supports regulatory compliance reviews.", "lim": "| Feature | Focus | Example |\n|---|---|---|\n| Azure RBAC | Who can act | Give Reader to a user |\n| Azure Policy | What is allowed | Only West Europe allowed |\n| Resource lock | Prevent change | CanNotDelete on production RG |\n| Purview | Data governance | Classify credit card data |\n| Cost Management | Spend | Budget alerts |\n\n| Lock | Read | Modify | Delete |\n|---|---|---|---|\n| CanNotDelete | Yes | Yes | No |\n| ReadOnly | Yes | No | No |", "exam": "- State the purpose of Azure Policy and how it differs from RBAC.\n- State the purpose of resource locks and the two lock types.\n- State the purpose of Microsoft Purview (data governance and compliance).\n- Choose the right tool from a scenario: \"block deployments to certain regions\" = Policy; \"prevent accidental delete\" = lock.", "stress": "- **Policy ≠ RBAC.** A user with Owner can still be blocked by a Deny policy.\n- **Locks override RBAC.** Even Owner cannot delete a locked resource until the lock is removed.\n- **ReadOnly locks can break things** (for example a ReadOnly lock on a storage account stops listing keys; on an App Service they can block normal operations).\n- **Locks are inherited** from the scope above.\n- **Policy does not grant permissions.** It only restricts or audits.\n- **Purview is about data, Defender for Cloud is about security posture.** Do not swap them.", "cues": "", "quiz": [{"k": "S", "q": "Your company wants to ensure resources can only be created in West Europe and North Europe. What should you use?", "o": [{"t": "Resource locks", "w": "Protect from change or delete, not restrict locations.", "c": false}, {"t": "Azure RBAC", "w": "Controls user permissions, not resource properties.", "c": false}, {"t": "Azure Policy", "w": "An allowed locations policy denies other regions.", "c": true}, {"t": "Azure Advisor", "w": "Recommends, does not enforce.", "c": false}]}, {"k": "S", "q": "You must prevent anyone, including Owners, from accidentally deleting a production resource group. What do you apply?", "o": [{"t": "A CanNotDelete lock", "w": "Blocks deletion regardless of RBAC role.", "c": true}, {"t": "A budget", "w": "Alerts on cost only.", "c": false}, {"t": "A tag", "w": "Information only.", "c": false}, {"t": "A ReadOnly role assignment", "w": "Roles do not stop an Owner and are not the lock mechanism.", "c": false}]}, {"k": "M", "q": "Which TWO statements about resource locks are true?", "o": [{"t": "Locks are inherited by child resources.", "w": "A lock on an RG applies to resources in it.", "c": true}, {"t": "A ReadOnly lock prevents modification.", "w": "Only read operations remain.", "c": true}, {"t": "Locks apply only to subscriptions.", "w": "Also resource groups and resources.", "c": false}, {"t": "Owners are not affected by locks.", "w": "Owners are blocked too.", "c": false}]}, {"k": "D", "q": "Discovering and classifying sensitive data across on-premises and SaaS is a job for {0}. Enforcing that every resource carries a CostCenter tag is a job for {1}.", "slots": [[{"t": "Microsoft Purview", "w": "Data governance and classification.", "c": true}, {"t": "Azure Policy", "w": "Resource rules.", "c": false}, {"t": "Azure Monitor", "w": "Telemetry.", "c": false}], [{"t": "Microsoft Purview", "w": "Data governance, not resource tagging.", "c": false}, {"t": "Azure Policy", "w": "Require-a-tag definitions.", "c": true}, {"t": "Azure Advisor", "w": "Recommends only.", "c": false}]]}, {"k": "Y", "q": "A developer with the Owner role tries to create a VM in a region blocked by a Deny policy.", "st": [{"t": "The deployment is blocked.", "a": true, "w": "Policy applies regardless of role."}, {"t": "Azure Policy can also report existing non-compliant resources.", "a": true, "w": "Compliance evaluation covers existing resources."}, {"t": "Azure Policy grants users permission to manage resources.", "a": false, "w": "Permissions come from RBAC."}]}]}, {"id": "f10", "title": "Describe features and tools for managing and deploying Azure resources", "terms": [["Azure portal", "Web-based graphical console for creating and managing Azure resources. Good for learning and one-off work."], ["Azure Cloud Shell", "Browser-based, authenticated shell available in the portal, with Azure CLI and Azure PowerShell preinstalled. Supports Bash and PowerShell."], ["Azure CLI", "Cross-platform command-line tool (`az`) for managing Azure resources."], ["Azure PowerShell", "PowerShell module (Az) with cmdlets named Verb-Noun, for managing Azure."], ["Azure Resource Manager (ARM)", "The management layer that handles all create, update and delete requests, applying RBAC, policy and locks."], ["ARM template", "JSON declarative file that defines resources to deploy. Idempotent."], ["Bicep", "Simpler declarative language that compiles to ARM templates."], ["Infrastructure as code (IaC)", "Managing infrastructure with versioned code and automation instead of manual clicks."], ["Declarative vs imperative", "Declarative says what end state you want (ARM, Bicep). Imperative says how, step by step (scripts)."], ["Idempotent", "Running the same deployment again gives the same result."], ["Azure Arc", "Extends Azure management and governance to resources outside Azure: on-premises servers, other clouds, Kubernetes clusters and data services."], ["Azure mobile app", "Monitor and manage resources from a phone."], ["Azure REST API", "The HTTP API underlying every tool."]], "fc": [["Azure Arc purpose", "Manage on-premises, multicloud and edge resources from Azure."], ["Cloud Shell shells", "Bash (Azure CLI) and PowerShell."], ["ARM template format", "JSON (Bicep is the simpler language that compiles to it)."], ["Declarative IaC means", "You describe the end state, not the steps."], ["What processes all Azure management requests?", "Azure Resource Manager."]], "how": "### One engine, many doors\nWhether you click in the portal, run `az`, run a PowerShell cmdlet, call REST or deploy a template, the request goes to **Azure Resource Manager**. That is why RBAC, policy, tags and locks behave consistently everywhere.\n\n### Choosing a tool\n| Tool | Best for |\n|---|---|\n| Portal | Learning, exploring, one-time changes |\n| Cloud Shell | Quick commands from any browser, no install |\n| Azure CLI | Scripting and automation, Linux/macOS/Windows |\n| Azure PowerShell | Scripting, especially for Windows admins |\n| ARM template / Bicep | Repeatable, versioned deployments |\n\n### Why IaC?\nConsistency, repeatability, speed, fewer mistakes, version control, and easy environment cloning. Templates are **declarative** and **idempotent**.\n\n### Azure Arc\nProject non-Azure resources (servers, Kubernetes, SQL Server) into Azure so you can manage them with the same tools: Policy, RBAC, tags, Monitor and Defender for Cloud.", "lim": "| | Azure CLI | Azure PowerShell |\n|---|---|---|\n| Command style | `az group create` | `New-AzResourceGroup` |\n| Output | JSON by default | .NET objects |\n| Platforms | Windows, macOS, Linux | Windows, macOS, Linux |\n| Cloud Shell | Yes | Yes |\n\n| ARM template | Bicep |\n|---|---|\n| JSON, verbose | Concise syntax |\n| Native format | Compiles to ARM JSON |\n| Declarative | Declarative |", "exam": "- Describe the portal, Cloud Shell, CLI and PowerShell and choose between them.\n- Define IaC, ARM and ARM templates (declarative, repeatable).\n- State the purpose of Azure Arc (manage on-premises and other clouds from Azure).", "stress": "- **Cloud Shell needs no local install**, but it persists files in an Azure Files share.\n- **ARM templates are declarative**; scripts are imperative. Templates are idempotent.\n- **Azure Arc does not move resources into Azure.** It projects them into Azure for management.\n- **Everything goes through ARM**, so locks, policy and RBAC apply no matter which tool you use.\n- **Bicep compiles to ARM JSON.** It is not a different engine.", "cues": "### CLI\n```\naz login\naz group create -n rg-demo -l eastus\naz deployment group create -g rg-demo --template-file main.bicep\n```\n### PowerShell\n```\nConnect-AzAccount\nNew-AzResourceGroup -Name rg-demo -Location eastus\nNew-AzResourceGroupDeployment -ResourceGroupName rg-demo -TemplateFile main.bicep\n```", "quiz": [{"k": "S", "q": "Which tool lets you run Azure CLI commands from a browser without installing anything?", "o": [{"t": "Azure mobile app", "w": "Monitoring and basic actions on a phone.", "c": false}, {"t": "Azure Cloud Shell", "w": "Browser-based shell with CLI and PowerShell.", "c": true}, {"t": "Azure Arc", "w": "Extends management outside Azure.", "c": false}, {"t": "Bicep", "w": "A template language.", "c": false}]}, {"k": "S", "q": "You need to apply Azure Policy and tags to servers running in your own datacenter. Which service should you use?", "o": [{"t": "Azure Migrate", "w": "Moves workloads to Azure.", "c": false}, {"t": "Azure Arc", "w": "Projects on-premises servers into Azure management.", "c": true}, {"t": "Azure Site Recovery", "w": "DR service.", "c": false}, {"t": "Azure Advisor", "w": "Recommendations only.", "c": false}]}, {"k": "M", "q": "Which TWO describe infrastructure as code with ARM templates?", "o": [{"t": "Declarative: describes the desired end state", "w": "ARM and Bicep are declarative.", "c": true}, {"t": "Idempotent: re-running gives the same result", "w": "Safe to deploy repeatedly.", "c": true}, {"t": "Requires clicking through the portal", "w": "The opposite of IaC.", "c": false}, {"t": "Only works for Windows VMs", "w": "Templates deploy any Azure resource type.", "c": false}]}, {"k": "D", "q": "Azure CLI commands start with {0} while Azure PowerShell cmdlets follow a {1} naming pattern.", "slots": [[{"t": "Get-", "w": "PowerShell verb.", "c": false}, {"t": "az", "w": "The CLI executable.", "c": true}, {"t": "azcli", "w": "Not the command.", "c": false}], [{"t": "az-noun", "w": "Not the pattern.", "c": false}, {"t": "Verb-Noun", "w": "Such as New-AzVm.", "c": true}, {"t": "noun.verb", "w": "Not PowerShell.", "c": false}]]}, {"k": "Y", "q": "Contoso deploys the same environment to dev, test and prod.", "st": [{"t": "An ARM template or Bicep file helps ensure consistent environments.", "a": true, "w": "IaC gives repeatability."}, {"t": "Using the CLI bypasses Azure Policy.", "a": false, "w": "All requests go through ARM, so policy applies."}, {"t": "Azure Arc requires that servers be migrated to Azure first.", "a": false, "w": "Arc manages them where they are."}]}]}, {"id": "f11", "title": "Describe monitoring tools in Azure", "terms": [["Azure Advisor", "Free personalised recommendation service across five pillars: Reliability, Security, Performance, Cost Optimization and Operational Excellence."], ["Azure Service Health", "Personalised view of Azure service issues, planned maintenance, health advisories and security advisories that affect your subscriptions and regions."], ["Azure status", "Public page showing global Azure service status (not personalised)."], ["Resource Health", "Health of one specific resource, such as a single VM, with historical state."], ["Health alert", "Notification when a Service Health event affects you."], ["Azure Monitor", "Platform for collecting, analysing and acting on telemetry (metrics and logs) from Azure, on-premises and other clouds."], ["Metrics", "Numeric, time-series data collected at intervals (for example CPU percentage)."], ["Logs", "Event and diagnostic records stored in a Log Analytics workspace and queried with KQL."], ["Log Analytics", "Tool and workspace for writing Kusto Query Language (KQL) queries on log data."], ["Azure Monitor alerts", "Rules that trigger notifications or actions when conditions are met."], ["Application Insights", "Application performance monitoring (APM) for web apps: requests, dependencies, exceptions, availability tests."], ["Action group", "A set of notification and automation targets (email, SMS, webhook, runbook) used by alerts."], ["Workbook / dashboard", "Visual reports over monitoring data."]], "fc": [["Advisor pillars", "Reliability, Security, Performance, Cost Optimization, Operational Excellence."], ["Service Health vs Azure status", "Personalised to you vs global and public."], ["Log Analytics query language", "KQL (Kusto Query Language)."], ["Application Insights purpose", "Application performance monitoring for web apps."], ["Resource Health shows", "Health of one specific resource."]], "how": "### Which tool answers which question?\n| Question | Tool |\n|---|---|\n| What should I improve? | Azure Advisor |\n| Is Azure having a problem that affects me? | Azure Service Health |\n| Is Azure broken globally? | Azure status page |\n| Is this particular VM healthy? | Resource Health |\n| What is my CPU/memory/error rate? Alert me. | Azure Monitor |\n| Why is my web app slow or failing? | Application Insights |\n\n### Azure Monitor\nSources → collect → **metrics** and **logs** → analyse (Log Analytics, workbooks) → respond (alerts, action groups, autoscale).\n\n### Service Health has three parts\n**Service issues** (outages now), **planned maintenance**, **health advisories** (such as deprecations). Add **security advisories**. You can create **health alerts** to be notified.\n\n### Advisor\nGives actionable recommendations in five pillars. It never changes things for you.", "lim": "| Tool | Scope | Proactive or reactive |\n|---|---|---|\n| Azure status | Global | Reactive |\n| Service Health | Your subscriptions and regions | Reactive, with alerts |\n| Resource Health | One resource | Reactive |\n| Advisor | Your resources | Proactive advice |\n| Azure Monitor | Your telemetry | Both (alerts and analysis) |", "exam": "- State the purpose of Advisor, Service Health and Azure Monitor.\n- Distinguish Service Health, Azure status and Resource Health.\n- Know Log Analytics, Azure Monitor alerts and Application Insights.", "stress": "- **Service Health is personalised to your subscriptions and regions**; **Azure status is global and public**.\n- **Resource Health** is about one resource; **Service Health** is about the platform.\n- **Advisor only recommends**; it does not fix, deploy or alert like Monitor.\n- **Application Insights is for application performance**, not for infrastructure metrics like VM CPU alone.\n- **Log Analytics uses KQL.**", "cues": "", "quiz": [{"k": "S", "q": "A planned maintenance event will affect your VMs in North Europe. Where do you find this information?", "o": [{"t": "Azure Advisor", "w": "Gives recommendations.", "c": false}, {"t": "Azure Service Health", "w": "Shows planned maintenance affecting your services.", "c": true}, {"t": "Cost Management", "w": "Spending tools.", "c": false}, {"t": "Azure Policy", "w": "Governance.", "c": false}]}, {"k": "S", "q": "Which service helps you diagnose slow responses and exceptions in your web application?", "o": [{"t": "Azure Advisor", "w": "Not an APM tool.", "c": false}, {"t": "Azure Resource Graph", "w": "Queries resource inventory.", "c": false}, {"t": "Application Insights", "w": "APM for web apps.", "c": true}, {"t": "Azure Service Health", "w": "Platform incidents.", "c": false}]}, {"k": "M", "q": "Which TWO are Azure Advisor recommendation categories?", "o": [{"t": "Cost Optimization", "w": "One of the five pillars.", "c": true}, {"t": "Reliability", "w": "One of the five pillars.", "c": true}, {"t": "Licensing", "w": "Not an Advisor category.", "c": false}, {"t": "Billing disputes", "w": "Not an Advisor category.", "c": false}]}, {"k": "D", "q": "Writing KQL queries against log data uses {0}. A recommendation to shut down an idle VM comes from {1}.", "slots": [[{"t": "Log Analytics", "w": "Query logs with KQL.", "c": true}, {"t": "Azure Advisor", "w": "Recommends.", "c": false}, {"t": "Resource Health", "w": "Single resource status.", "c": false}], [{"t": "Azure Monitor alerts", "w": "Notify on conditions.", "c": false}, {"t": "Azure Advisor", "w": "Cost optimization recommendation.", "c": true}, {"t": "Service Health", "w": "Platform events.", "c": false}]]}, {"k": "Y", "q": "Your VM is unresponsive and you suspect a platform issue.", "st": [{"t": "Resource Health can show whether the platform affects this specific VM.", "a": true, "w": "It reports resource-level health."}, {"t": "Azure status shows issues that apply only to your subscription.", "a": false, "w": "It is global; Service Health is personalised."}, {"t": "Azure Monitor alerts can trigger an action group that sends email.", "a": true, "w": "Alerts use action groups."}]}]}, {"id": "x01", "title": "Manage Microsoft Entra users and groups", "terms": [["Microsoft Entra ID", "Cloud identity provider (formerly Azure AD). Holds users, groups, devices, apps. Each organization has a tenant (directory)."], ["Tenant", "A dedicated Entra ID instance that represents your organization and trusts one or more subscriptions."], ["User principal name (UPN)", "The sign-in name of a user, in email format, such as `ana@contoso.com`. Must use a verified domain."], ["Member user", "An internal user created in or synced to your tenant."], ["Guest user", "An external user invited through B2B collaboration; keeps their own credentials at their home identity provider."], ["Security group", "Group used to assign access to resources and apps."], ["Microsoft 365 group", "Group with a shared mailbox, calendar, Teams and SharePoint. Can contain users only, and is not for RBAC role assignment unless role-assignable (security groups are normal for RBAC)."], ["Assigned membership", "You add and remove members manually."], ["Dynamic membership", "Rules based on user or device attributes add and remove members automatically. Requires Entra ID P1."], ["Role-assignable group", "A group created with `isAssignableToRole = true` so that Entra roles can be assigned to it. The setting cannot be changed later."], ["Group-based licensing", "Assign licenses to a group so members get them automatically. Requires Entra ID P1."], ["Usage location", "Country attribute on a user. Required before a license can be assigned."], ["Self-service password reset (SSPR)", "Lets users reset or unlock their own password after verifying identity with registered methods."], ["Password writeback", "Sends cloud password changes back to on-premises AD. Needs Entra Connect and P1 or higher."], ["Authentication methods", "Ways to verify identity: Microsoft Authenticator, SMS, voice call, email, security questions, OATH tokens, FIDO2 and others."], ["Microsoft Entra Connect", "Syncs on-premises AD identities with Entra ID."], ["Bulk operations", "CSV-based create, invite and delete of users in the portal."], ["Soft delete (users)", "Deleted users go to Deleted users and can be restored for 30 days."]], "fc": [["Dynamic group license requirement", "Microsoft Entra ID P1."], ["License assignment prerequisite", "Usage location set on the user."], ["Deleted user restore window", "30 days."], ["SSPR scope options", "None, Selected, All."], ["Methods admins must use for SSPR", "Two methods (no security questions)."], ["Password writeback needs", "Entra Connect and P1 or higher."], ["Role-assignable group setting", "Chosen at creation and cannot be changed."], ["Guest user is created through", "B2B invitation."]], "how": "### Users\n- **Create**: Entra admin center > Users > New user > Create new user (internal) or Invite external user. Set display name, UPN, password, groups, roles, usage location.\n- **Properties**: job info, contact info, manager, authentication methods, sign-in settings (block sign-in).\n- **Cloud-only vs synced**: synced users are managed on-premises (source of authority is AD). Many attributes are read-only in the cloud.\n- **Bulk**: download the CSV template, fill it, upload. Delete and invite also have bulk templates.\n\n### Groups\n- Choose **type** (Security or Microsoft 365) and **membership type** (Assigned, Dynamic User, Dynamic Device).\n- Dynamic rule example: `user.department -eq \"Sales\"`. Membership is recalculated automatically.\n- Groups can be nested (security groups) but nested membership has limits for some features such as group-based licensing (not applied through nested groups).\n- Owners manage membership; you can also allow users to manage their own groups.\n\n### Licenses\n1. Set **Usage location** on the user.\n2. Assign a license directly, or to a group.\n3. Check **Licenses > Reprocess** if assignment errors occur (for example conflicting service plans or insufficient licenses).\nRemoving the user from the licensed group removes the license.\n\n### External users (B2B)\n- Invite by email. The guest redeems the invitation and signs in with their own account (Microsoft account, another Entra tenant, or one-time passcode).\n- Control what guests can see in **External collaboration settings** (guest user access, who can invite).\n- Give guests access by adding them to groups or assigning Azure roles.\n\n### SSPR\n1. Entra ID > Password reset > Properties: enable for **None / Selected / All**.\n2. Set **Authentication methods**: number of methods required (1 or 2) and which are allowed.\n3. Registration: require users to register at sign-in and set how often to reconfirm.\n4. Notifications; on-premises integration (writeback) with Entra Connect.\nAdministrators are always required to use **two** methods.", "lim": "| Item | Detail |\n|---|---|\n| Dynamic groups | Entra ID P1 |\n| Group-based licensing | Entra ID P1 |\n| SSPR with writeback | P1 or higher (Free covers cloud-only users' basic self-service change) |\n| Deleted user recovery | 30 days |\n| Role-assignable groups | Setting fixed at creation, up to 500 per tenant |\n| SSPR methods required | 1 or 2 (admins always 2) |\n| Security questions | Not available for admin accounts |\n\n| Group type | Membership | Typical use |\n|---|---|---|\n| Security | Assigned or Dynamic | Access to apps and Azure resources |\n| Microsoft 365 | Assigned or Dynamic | Teams, SharePoint, shared mailbox |", "exam": "- Create users and groups; choose assigned vs dynamic membership.\n- Assign licenses, including group-based licensing and the usage location prerequisite.\n- Invite and manage guest users; understand collaboration settings.\n- Configure SSPR scope (None/Selected/All), required methods and registration.\n- Know which features need P1 or P2.", "stress": "- **Usage location must be set before assigning a license**, otherwise assignment fails.\n- **Dynamic groups and group-based licensing need Entra ID P1.**\n- **Group-based licensing does not process nested group membership.**\n- **Role-assignable group must be set at creation**; you cannot turn it on later.\n- **Admins must use two SSPR methods**, and cannot use security questions.\n- **Password writeback requires Entra Connect** and P1 or higher.\n- **Guests keep their own credentials**; you cannot set their password.\n- **Entra roles are not Azure RBAC roles.** Global Administrator manages the directory, not Azure resources, unless access is elevated.\n- Deleted users can be restored for **30 days**.", "cues": "### Portal\nMicrosoft Entra admin center (or Azure portal) > Microsoft Entra ID > Users / Groups / Password reset / Licenses.\n### CLI\n```\naz ad user create --display-name \"Ana Lima\" --user-principal-name ana@contoso.com --password \"P@ssw0rd!2345\"\naz ad group create --display-name \"Sales\" --mail-nickname sales\naz ad group member add --group \"Sales\" --member-id <user-object-id>\naz ad user list --filter \"startswith(displayName,'Ana')\"\n```\n### PowerShell (Microsoft Graph)\n```\nConnect-MgGraph -Scopes \"User.ReadWrite.All\",\"Group.ReadWrite.All\"\nNew-MgUser -DisplayName \"Ana Lima\" -UserPrincipalName ana@contoso.com -MailNickname ana -AccountEnabled -PasswordProfile @{Password=\"P@ssw0rd!2345\"}\nNew-MgInvitation -InvitedUserEmailAddress partner@fabrikam.com -InviteRedirectUrl \"https://myapps.microsoft.com\"\n```", "quiz": [{"k": "S", "q": "Users in the Sales department must automatically become members of a group as HR updates the Department attribute. What do you configure?", "o": [{"t": "Assigned membership", "w": "You would maintain it manually.", "c": false}, {"t": "Dynamic User membership", "w": "Rule on the department attribute (needs P1).", "c": true}, {"t": "A Microsoft 365 group with owners", "w": "Owners still add members manually.", "c": false}, {"t": "Dynamic Device membership", "w": "Evaluates device attributes, not user department.", "c": false}]}, {"k": "S", "q": "You assign an Entra ID P1 license to a new user and it fails. The user was created with no country set. What is the fix?", "o": [{"t": "Add the user to a role-assignable group", "w": "Not related to licensing.", "c": false}, {"t": "Set the Usage location property", "w": "A license requires a usage location.", "c": true}, {"t": "Enable SSPR", "w": "Not related to license assignment.", "c": false}, {"t": "Convert the user to a guest", "w": "Guests need the same prerequisite and it changes nothing here.", "c": false}]}, {"k": "M", "q": "Which TWO statements about SSPR are true?", "o": [{"t": "Administrators must use two verification methods.", "w": "Admin policy is stronger by default.", "c": true}, {"t": "Password writeback requires Microsoft Entra Connect.", "w": "Needed to update on-premises AD.", "c": true}, {"t": "Security questions can be used by administrators.", "w": "Admins cannot use them.", "c": false}, {"t": "SSPR can only be enabled for All users.", "w": "You can enable for Selected groups.", "c": false}]}, {"k": "D", "q": "To invite a partner to use your SharePoint site you create a {0} user. To bulk create 500 employees you upload a {1}.", "slots": [[{"t": "member", "w": "Internal account.", "c": false}, {"t": "guest", "w": "B2B external user.", "c": true}, {"t": "service principal", "w": "Identity for apps.", "c": false}], [{"t": "JSON template", "w": "Not the bulk format.", "c": false}, {"t": "CSV file", "w": "Bulk create uses a CSV template.", "c": true}, {"t": "ARM template", "w": "Deploys Azure resources.", "c": false}]]}, {"k": "Y", "q": "Your tenant has Entra ID Free licensing.", "st": [{"t": "You can create a dynamic membership group.", "a": false, "w": "Dynamic groups require P1."}, {"t": "A guest user can be added to a security group.", "a": true, "w": "Guests can be group members."}, {"t": "A deleted user can be restored within 30 days.", "a": true, "w": "Soft-delete window."}]}]}, {"id": "x02", "title": "Manage access to Azure resources", "terms": [["Azure role-based access control (Azure RBAC)", "Authorization system for Azure resources built on role assignments."], ["Security principal", "Who gets access: user, group, service principal or managed identity."], ["Role definition", "A collection of permissions: `Actions`, `NotActions`, `DataActions`, `NotDataActions`, `AssignableScopes`."], ["Role assignment", "Security principal + role definition + scope. The thing that actually grants access."], ["Scope", "Level where access applies: management group, subscription, resource group, resource. Child scopes inherit."], ["Owner", "Full access to everything, including assigning roles."], ["Contributor", "Create and manage all resources, cannot assign roles."], ["Reader", "View everything, change nothing."], ["User Access Administrator", "Manage user access to Azure resources, not the resources."], ["Role Based Access Control Administrator", "Assign roles with optional conditions, no other resource access."], ["Custom role", "Your own role defined in JSON when no built-in role fits."], ["Management plane", "Operations on the resource itself (create VM, list keys)."], ["Data plane", "Operations on the data inside a resource (read a blob). Uses DataActions."], ["Deny assignment", "Blocks actions even if a role assignment allows them. Created by Azure Blueprints/managed apps, not directly by you."], ["Check access", "IAM feature to see an identity's effective access at a scope."], ["Elevate access", "Global Administrator option to grant themselves User Access Administrator at root scope."], ["Managed identity", "Azure-managed identity for a resource, used to get role-based access without credentials."], ["Entra role vs Azure role", "Entra roles manage directory objects (users, groups). Azure roles manage Azure resources."]], "fc": [["Role that can assign roles but not manage resources", "User Access Administrator."], ["Contributor cannot", "Assign roles."], ["Role assignment formula", "Security principal + role definition + scope."], ["Subscription role assignment limit", "4,000."], ["Custom role limit", "5,000 per tenant."], ["NotActions means", "Subtract actions from the allowed set. It is not a deny."], ["Data plane role for blobs", "Storage Blob Data Reader / Contributor / Owner."], ["Elevate access gives", "User Access Administrator at the root scope to a Global Administrator."]], "how": "### Anatomy of an assignment\n**Who** (principal) + **what** (role) + **where** (scope). Always at the narrowest scope that works, and prefer **groups** over individuals.\n\n### Inheritance\nAssignments flow down: management group → subscription → resource group → resource. A child cannot remove an inherited allow. Permissions are **additive**: if a user is Reader at the subscription and Contributor at an RG, they are Contributor in that RG.\n\n### Choosing a built-in role\n| Need | Role |\n|---|---|\n| Full control and delegate access | Owner |\n| Manage resources, not access | Contributor |\n| View only | Reader |\n| Manage only access | User Access Administrator |\n| Run VMs only | Virtual Machine Contributor |\n| Read blob data | Storage Blob Data Reader |\n| Manage network only | Network Contributor |\n\n### Interpreting access\nIn **Access control (IAM)**:\n- **Check access**: effective permissions of a principal.\n- **Role assignments**: who has what at this scope (includes inherited ones, shown with the inherited scope).\n- **Roles**: list definitions. **Deny assignments**: blocks that apply.\nEffective access = union of all assignments from all scopes (minus any deny assignments).\n\n### Custom roles\nCreate from JSON when built-ins do not fit. Include `Actions` (allow), `NotActions` (subtract from Actions, not a deny), and `AssignableScopes`. Up to 5,000 custom roles per tenant.\n\n### Management plane vs data plane\nA role such as Contributor controls the management plane. Reading blob **data** with Entra authentication needs a data role such as **Storage Blob Data Reader**. Note that anyone who can list storage keys can access data with the key.", "lim": "| Limit | Value |\n|---|---|\n| Role assignments per subscription | 4,000 |\n| Role assignments per management group | 500 |\n| Custom roles per tenant | 5,000 |\n| Role assignment propagation | Can take up to several minutes |\n\n| Role | Create resources | Delete resources | Assign roles |\n|---|---|---|---|\n| Owner | Yes | Yes | Yes |\n| Contributor | Yes | Yes | No |\n| Reader | No | No | No |\n| User Access Administrator | No | No | Yes |", "exam": "- Choose the right built-in role for a scenario (Owner vs Contributor vs User Access Administrator).\n- Assign roles at the right scope and predict the effective access from multiple assignments.\n- Interpret IAM role assignments, including inherited ones.\n- Distinguish management plane vs data plane roles, and Entra roles vs Azure roles.", "stress": "- **Contributor cannot assign roles**; Owner and User Access Administrator can.\n- **Assignments are additive and inherited.** You cannot reduce access by assigning a lower role at a child scope.\n- **NotActions is not a deny.** If another assignment grants the action, it is allowed.\n- **Global Administrator does not automatically have access to Azure subscriptions.** They must elevate access.\n- **Data roles are separate.** Contributor does not read blob data via Entra ID (but can list keys and use them).\n- **Role assignments can take minutes to apply.**\n- Assign to **groups**, not individual users, to stay under the 4,000 limit.", "cues": "### Portal\nResource, RG or subscription > **Access control (IAM)** > Add > Add role assignment. Use **Check access** to verify.\n### CLI\n```\naz role assignment create --assignee user@contoso.com --role \"Contributor\" --scope /subscriptions/<subId>/resourceGroups/rg-app\naz role assignment list --assignee user@contoso.com --all --include-inherited -o table\naz role definition list --name \"Reader\"\n```\n### PowerShell\n```\nNew-AzRoleAssignment -SignInName user@contoso.com -RoleDefinitionName \"Reader\" -ResourceGroupName rg-app\nGet-AzRoleAssignment -SignInName user@contoso.com\n```", "quiz": [{"k": "S", "q": "A user must create and manage VMs in one resource group but must not be able to grant access to others. What do you assign at the resource group scope?", "o": [{"t": "Owner", "w": "Includes the ability to assign roles.", "c": false}, {"t": "Contributor", "w": "Manages resources and cannot assign roles.", "c": true}, {"t": "User Access Administrator", "w": "Manages access, not resources.", "c": false}, {"t": "Reader", "w": "View only.", "c": false}]}, {"k": "S", "q": "A user is Reader at the subscription and has Contributor assigned on resource group RG1. What can the user do in RG2?", "o": [{"t": "Read only", "w": "Reader is inherited, Contributor applies to RG1 only.", "c": true}, {"t": "Create resources", "w": "Contributor applies only to RG1.", "c": false}, {"t": "Nothing", "w": "Reader inherits down.", "c": false}, {"t": "Delete resources", "w": "Needs Contributor or Owner.", "c": false}]}, {"k": "M", "q": "Which TWO roles can assign Azure roles to other users?", "o": [{"t": "Owner", "w": "Full permissions including role assignment.", "c": true}, {"t": "User Access Administrator", "w": "Manages user access.", "c": true}, {"t": "Contributor", "w": "Cannot assign roles.", "c": false}, {"t": "Reader", "w": "View only.", "c": false}]}, {"k": "D", "q": "A Global Administrator who cannot see subscriptions must enable {0}. Reading blob data with Entra ID requires the {1} role.", "slots": [[{"t": "Owner on every RG", "w": "Not required.", "c": false}, {"t": "Elevate access", "w": "Grants User Access Administrator at root.", "c": true}, {"t": "Privileged Identity Management only", "w": "PIM does not fix this alone.", "c": false}], [{"t": "Contributor", "w": "Management plane only.", "c": false}, {"t": "Storage Blob Data Reader", "w": "A data-plane role.", "c": true}, {"t": "Reader", "w": "Management plane only.", "c": false}]]}, {"k": "Y", "q": "User1 has Reader on the subscription and Virtual Machine Contributor on RG-Prod.", "st": [{"t": "User1 can start a VM in RG-Prod.", "a": true, "w": "VM Contributor allows VM operations."}, {"t": "User1 can create a virtual network in RG-Prod.", "a": false, "w": "VM Contributor does not manage networks."}, {"t": "User1 can view resources in RG-Dev.", "a": true, "w": "Inherited Reader."}]}, {"k": "O", "q": "Put the three parts of an Azure role assignment in the order usually phrased: who gets access, what they can do, where it applies.", "steps": ["Security principal (who)", "Role definition (what)", "Scope (where)"], "w": "A role assignment binds a principal to a role at a scope."}]}, {"id": "x03", "title": "Manage Azure subscriptions and governance", "terms": [["Azure Policy", "Evaluates resources against rules (definitions) and can deny, audit, modify or deploy to enforce standards."], ["Policy definition", "JSON rule with `if` condition and `then` effect."], ["Initiative", "A group of policy definitions assigned together to meet a goal."], ["Policy assignment", "Applies a definition or initiative to a scope, with optional exclusions."], ["Policy effects", "Deny, Audit, AuditIfNotExists, Append, Modify, DeployIfNotExists, Disabled."], ["Remediation task", "Fixes existing non-compliant resources for Modify and DeployIfNotExists. Uses a managed identity."], ["Resource lock", "Protection against accidental delete (CanNotDelete) or change (ReadOnly)."], ["Tag", "Name-value metadata on resources, resource groups and subscriptions."], ["Resource group", "Logical container for resources with the same lifecycle."], ["Resource move", "Moving a resource to another resource group or subscription. Resource ID changes."], ["Subscription", "Billing and access boundary and a container for resources. Linked to one tenant."], ["Management group", "Container above subscriptions for applying governance. Up to six levels deep."], ["Budget", "Cost threshold with alerts on actual or forecasted spend."], ["Azure Advisor", "Gives personalised recommendations including cost (idle and underused resources, reservations)."], ["Cost analysis", "Explore costs by dimension: resource, group, tag, service, location."], ["Quota", "Limit per subscription per region, such as vCPU cores. Increase through Usage + quotas or support request."]], "fc": [["Max tags per resource", "50."], ["Policy effect that blocks creation", "Deny."], ["Effect that auto-fixes existing resources", "Modify or DeployIfNotExists with a remediation task."], ["Management group maximum depth", "6 levels (not counting root or subscription)."], ["Subscription move to another directory loses", "RBAC assignments and managed identities."], ["What changes when you move a resource?", "The resource ID."], ["Permission needed to create locks", "Microsoft.Authorization/locks/* (Owner or User Access Administrator)."], ["Budget actions", "Alerts and action groups only. It does not stop spending."]], "how": "### Azure Policy\n1. **Define**: use a built-in definition or write your own.\n2. **Assign** to a scope. Optionally **exclude** child scopes.\n3. **Evaluate**: new and updated resources are checked on create/update, and existing resources about every 24 hours (or on demand).\n4. **Remediate**: for Modify and DeployIfNotExists create a remediation task.\n\nEffect order of evaluation: Disabled, Append/Modify, Deny, Audit. Common policies: Allowed locations, Allowed VM SKUs, Require a tag and its value, Inherit a tag from the resource group, Deny public IPs.\n\n### Locks\nScope: subscription, RG or resource. Types: **CanNotDelete** and **ReadOnly**. Inherited by children. Lock overrides RBAC. You need `Microsoft.Authorization/locks/*` permission (Owner or User Access Administrator) to create or remove.\n\n### Tags\n- Up to **50** tag name/value pairs per resource, RG or subscription.\n- Tag **names** are case-insensitive, tag **values** are case-sensitive.\n- **Not inherited**; use Azure Policy (Modify) to inherit from RG or subscription.\n- Not all resource types support tags.\n- When a resource moves, its own tags go with it. Tags set on the old resource group do not follow.\n\n### Resource groups\nCreate, delete, and **move resources**. A move changes the resource ID. Both source and target RG are locked for writes during the move. Some resource types cannot be moved. Deleting an RG deletes all resources in it. Locks can block the delete.\n\n### Subscriptions\nCreate, rename, change billing ownership, **transfer to another directory** (RBAC assignments and managed identities are lost), cancel (resources disabled, recoverable for a period before permanent deletion). Use **Usage + quotas** to check and raise limits.\n\n### Management groups\n- Tenant root management group at the top.\n- Up to **6 levels** (not counting root or subscription level) and **10,000** management groups per directory.\n- Each management group and subscription has a **single parent**.\n- Policy and RBAC assigned to a management group inherit to all child subscriptions.\n- To work with the root group, a Global Administrator must elevate access.\n\n### Cost management\n- **Budgets**: scope (subscription, RG, management group), amount, reset period, alert conditions on actual or forecast spend, action groups.\n- **Cost analysis** and **exports**.\n- **Advisor**: right-size or shut down underused VMs, reservation recommendations. Postpone or dismiss recommendations as needed.", "lim": "| Item | Limit or fact |\n|---|---|\n| Tags per resource | 50 |\n| Management group depth | 6 levels below root |\n| Management groups per directory | 10,000 |\n| Policy compliance scan | Roughly every 24 hours for existing resources |\n| Resource group nesting | Not supported |\n| Tag value case | Case-sensitive (names are not) |\n\n| Effect | What it does |\n|---|---|\n| Deny | Blocks non-compliant create or update |\n| Audit | Logs a warning in the activity log |\n| Append | Adds fields (for example tags) during create |\n| Modify | Adds or changes properties/tags; remediation possible |\n| DeployIfNotExists | Deploys a related resource if missing |\n| AuditIfNotExists | Flags when a related resource is missing |", "exam": "- Choose between policy, RBAC and locks for a scenario.\n- Pick the right policy effect (Deny vs Audit vs Modify vs DeployIfNotExists).\n- Apply tags and understand non-inheritance and tag policies.\n- Move resources between RGs and subscriptions and know the side effects.\n- Build a management group hierarchy and understand inheritance.\n- Create budgets and interpret Advisor cost recommendations.", "stress": "- **Tags do not inherit.** Use Policy (Modify) or Append for inheritance.\n- **A policy with Deny does not change existing resources**; it marks them non-compliant. Use remediation for Modify and DeployIfNotExists.\n- **Remediation tasks need a managed identity** with sufficient rights.\n- **Locks override RBAC**, so a ReadOnly lock can block normal actions like listing keys.\n- **Moving a subscription to another directory removes role assignments and managed identities.**\n- **Moving a resource changes its resource ID**, and the source and target RGs are locked during the move.\n- **A budget never stops resources.**\n- Management group **depth is 6**, and each group has **one parent**.\n- **Exclusions** let a scope be skipped by an assignment.", "cues": "### CLI\n```\naz policy assignment create --name allowed-loc --policy <definitionId> --scope /subscriptions/<subId> --params \"{\\\"listOfAllowedLocations\\\":{\\\"value\\\":[\\\"westeurope\\\"]}}\"\naz lock create --name nodelete --lock-type CanNotDelete --resource-group rg-prod\naz tag update --resource-id <id> --operation merge --tags Dept=Finance\naz resource move --destination-group rg-new --ids <resourceId>\naz account management-group create --name mg-prod\naz consumption budget list\n```\n### PowerShell\n```\nNew-AzResourceLock -LockName nodelete -LockLevel CanNotDelete -ResourceGroupName rg-prod\nMove-AzResource -DestinationResourceGroupName rg-new -ResourceId <id>\nNew-AzManagementGroup -GroupName mg-prod\n```", "quiz": [{"k": "S", "q": "You must ensure all new resources receive the tag Environment from their resource group if the tag is missing. What should you use?", "o": [{"t": "A resource lock", "w": "Does not add tags.", "c": false}, {"t": "Azure Advisor", "w": "Recommends only.", "c": false}, {"t": "Azure Policy with the Modify effect (inherit tag from resource group)", "w": "Adds the tag automatically.", "c": true}, {"t": "RBAC custom role", "w": "Controls permissions, not tags.", "c": false}]}, {"k": "S", "q": "You need to stop the deletion of a production resource group, but still allow changes to its resources. What do you apply?", "o": [{"t": "A CanNotDelete lock on the RG", "w": "Allows changes but blocks delete.", "c": true}, {"t": "A ReadOnly lock on the RG", "w": "Also blocks changes.", "c": false}, {"t": "A Deny policy", "w": "Does not prevent RG deletion.", "c": false}, {"t": "A budget", "w": "Cost alerting only.", "c": false}]}, {"k": "M", "q": "Which TWO actions occur when you move a subscription to a different Microsoft Entra tenant?", "o": [{"t": "Role assignments are removed.", "w": "Directory objects do not move.", "c": true}, {"t": "Managed identities stop working.", "w": "They belong to the old tenant.", "c": true}, {"t": "Policy assignments always remain unchanged.", "w": "Policies are affected by the new hierarchy.", "c": false}, {"t": "Billing stops permanently.", "w": "Billing is unaffected by the directory change.", "c": false}]}, {"k": "D", "q": "To enforce that VMs can only use approved SKUs you use {0} with the {1} effect.", "slots": [[{"t": "Azure RBAC", "w": "Permissions, not property rules.", "c": false}, {"t": "Azure Policy", "w": "Evaluates resource properties.", "c": true}, {"t": "Resource locks", "w": "Protect from changes.", "c": false}], [{"t": "Audit", "w": "Reports but allows.", "c": false}, {"t": "Deny", "w": "Blocks non-compliant deployments.", "c": true}, {"t": "Disabled", "w": "Turns the policy off.", "c": false}]]}, {"k": "Y", "q": "You assign an Allowed locations policy (Deny) at a subscription that already has VMs in other regions.", "st": [{"t": "The existing VMs are deleted.", "a": false, "w": "Deny only affects new or changed resources."}, {"t": "The existing VMs are reported as non-compliant.", "a": true, "w": "Compliance evaluation flags them."}, {"t": "A resource group can be excluded from the assignment.", "a": true, "w": "Exclusions can be set."}]}, {"k": "Y", "q": "You create a budget for a subscription with an alert at 90 percent of actual spend.", "st": [{"t": "The budget stops all VMs when spending reaches 100 percent.", "a": false, "w": "Budgets only alert unless you automate action."}, {"t": "An action group can trigger automation when the alert fires.", "a": true, "w": "Budgets can call action groups."}, {"t": "The budget can be scoped to a resource group.", "a": true, "w": "Subscriptions, RGs and management groups are valid scopes."}]}]}, {"id": "x04", "title": "Configure access to storage", "terms": [["Storage firewall", "Network rules on a storage account that limit which networks can reach its public endpoints. Default action can be Allow (all networks) or Deny (selected networks only)."], ["Virtual network rule", "Allows a specific subnet to reach the account. The subnet needs the `Microsoft.Storage` service endpoint."], ["IP network rule", "Allows a public IPv4 address or CIDR range. Private ranges (10.x, 172.16.x, 192.168.x) are not allowed."], ["Trusted Microsoft services exception", "Lets selected Azure services (such as Azure Backup) bypass the firewall."], ["Private endpoint", "Private IP in your VNet for the storage account, accessed through Azure Private Link."], ["Shared access signature (SAS)", "A signed URI that delegates limited access to storage resources for a limited time."], ["User delegation SAS", "Secured with Entra ID credentials. Blob and Data Lake only. Valid up to 7 days. The most secure SAS."], ["Service SAS", "Signed with the account key. Grants access to one service (Blob, Queue, Table, File)."], ["Account SAS", "Signed with the account key. Can reach one or more services and some service-level operations."], ["Stored access policy", "A named set of permissions and times on a container, share, queue or table that a service SAS can reference so you can change or revoke it centrally."], ["Access keys", "Two 512-bit keys (key1 and key2) that give full access to the account. Rotate by regenerating one while apps use the other."], ["Anonymous (public) access", "Read access without credentials to a container or blob, when allowed."], ["Storage File Data SMB Share Contributor", "RBAC role giving read, write and delete on Azure Files shares (share-level permission)."], ["NTFS permissions (Windows ACLs)", "File and directory permissions enforced on Azure Files with identity-based access."], ["Identity-based authentication for Azure Files", "Mount SMB shares with domain credentials using AD DS, Microsoft Entra Domain Services, or Microsoft Entra Kerberos."], ["Shared Key authorization", "Requests authorised with the account key. Can be disabled so only Entra ID or SAS is accepted."]], "fc": [["SAS signed with Entra ID", "User delegation SAS (blob and ADLS only, max 7 days)."], ["Stored access policy limit", "5 per container, share, queue or table."], ["Service SAS can be revoked by", "Deleting or editing its stored access policy."], ["Number of storage access keys", "Two (key1, key2) for rotation."], ["Subnet prerequisite for a VNet rule", "Microsoft.Storage service endpoint."], ["IP rules do not accept", "Private IP address ranges."], ["SMB uses TCP port", "445."], ["Azure Files share-level roles", "Storage File Data SMB Share Reader, Contributor, Elevated Contributor."]], "how": "### Layers of control\n1. **Network**: firewall, VNet rules, private endpoint.\n2. **Authentication and authorization**: Entra ID + RBAC (best), SAS, or account key.\n3. **Data protection**: encryption, soft delete, versioning.\n\n### Storage firewalls and virtual networks\n- Default for a new account: **Enabled from all networks**. Switch to **Enabled from selected virtual networks and IP addresses** to deny by default.\n- Add **VNet rules** (subnet with Microsoft.Storage service endpoint), **IP rules**, **resource instance rules** and exceptions (trusted Microsoft services, read logging and metrics).\n- **Private endpoints** bypass the public endpoint entirely; you can then disable public network access.\n- The firewall applies to all protocols (blob, file, and so on) and all authorization types including SAS.\n\n### Shared access signatures\n| SAS type | Signed with | Services | Notes |\n|---|---|---|---|\n| User delegation | Entra ID user delegation key | Blob and ADLS Gen2 | Most secure, max 7 days |\n| Service | Account key | One service | Can use a stored access policy |\n| Account | Account key | One or more | Cannot use a stored access policy |\n\nA SAS carries: **permissions** (r,w,d,l...), **start and expiry**, **allowed IPs**, **protocol** (HTTPS only), and the **resource**. Anyone with the URI has the access, so keep expiry short.\n\n### Stored access policies\nAttach up to **5 policies** per container/share/queue/table. A service SAS references the policy by identifier. To **revoke**: delete the policy or change its expiry (the SAS stops working). A service SAS without a policy can only be revoked by rotating the account key.\n\n### Access keys\nTwo keys allow rotation without downtime: move apps to key2, regenerate key1, move back. Store keys in **Azure Key Vault**. Disabling shared key access forces Entra ID or user-delegation SAS.\n\n### Identity-based access for Azure Files\n1. Enable an identity source on the storage account: **AD DS**, **Entra Domain Services** or **Entra Kerberos** (for hybrid identities).\n2. Assign **share-level** RBAC roles: Storage File Data SMB Share Reader, Contributor, Elevated Contributor.\n3. Configure **directory and file** permissions (NTFS ACLs) from a domain-joined machine.\n4. Mount over SMB (port **445** outbound must be open).\nUsing the account key mounts with full superuser access.", "lim": "| Limit or fact | Value |\n|---|---|\n| Virtual network rules per account | 200 |\n| IP network rules per account | 400 |\n| Stored access policies per resource | 5 |\n| User delegation SAS maximum validity | 7 days |\n| Access keys | 2 |\n| SMB port | 445 |\n| IP rule restrictions | Public IPv4 only; no private ranges |\n\n| Need | Choose |\n|---|---|\n| Time-limited access for an external user to a blob | User delegation SAS (or service SAS) |\n| Revoke access without rotating keys | Stored access policy |\n| Keep traffic off the public internet | Private endpoint |\n| Restrict by corporate public IP | IP network rule |\n| Domain users mount a share with their credentials | Identity-based access for Azure Files |", "exam": "- Configure firewall and virtual network rules, and know which protocols and clients they affect.\n- Choose a SAS type, create a SAS and revoke it with a stored access policy.\n- Rotate access keys without downtime.\n- Configure identity-based access for Azure Files (identity source, share roles, NTFS ACLs).\n- Choose between service endpoint and private endpoint for storage.", "stress": "- **IP rules cannot use private IP ranges**; they are for public IPv4 only. For private access use a service endpoint or private endpoint.\n- **A VNet rule needs the Microsoft.Storage service endpoint on the subnet.**\n- **Account SAS and user delegation SAS cannot use a stored access policy.** Only a service SAS can.\n- **Regenerating an access key invalidates every SAS signed with that key.**\n- **Stored access policies are the way to revoke a service SAS.**\n- **Firewall rules also block SAS requests** from non-allowed networks.\n- **Azure Files identity-based access needs both share-level RBAC and NTFS ACLs.**\n- **Port 445 blocked** (common on ISPs) prevents SMB mounts. Use a VPN, ExpressRoute or Azure File Sync.\n- **Trusted Microsoft services exception** lets Azure Backup and similar services through the firewall.", "cues": "### Portal\nStorage account > **Security + networking** > Networking / Access keys / Shared access signature. Container > Shared access tokens, Access policy.\n### CLI\n```\naz storage account update -n stdemo -g rg --default-action Deny\naz network vnet subnet update -g rg --vnet-name vnet --name sub1 --service-endpoints Microsoft.Storage\naz storage account network-rule add -n stdemo -g rg --vnet-name vnet --subnet sub1\naz storage account network-rule add -n stdemo -g rg --ip-address 203.0.113.0/24\naz storage container policy create -c data --account-name stdemo -n readpol --permissions r --expiry 2027-01-01\naz storage blob generate-sas --account-name stdemo -c data -n a.txt --permissions r --expiry 2026-12-31 --auth-mode login --as-user\naz storage account keys renew --account-name stdemo -g rg --key primary\n```\n### PowerShell\n```\nUpdate-AzStorageAccountNetworkRuleSet -ResourceGroupName rg -Name stdemo -DefaultAction Deny\nNew-AzStorageAccountSASToken -Service Blob -ResourceType Object -Permission r -ExpiryTime (Get-Date).AddDays(1) -Context $ctx\n```", "quiz": [{"k": "S", "q": "You give a contractor temporary read access to one blob and want to be able to revoke it without regenerating account keys. What do you do?", "o": [{"t": "Create an account SAS", "w": "Cannot use a stored access policy.", "c": false}, {"t": "Create a service SAS that references a stored access policy", "w": "Deleting the policy revokes it.", "c": true}, {"t": "Share access key1", "w": "Gives full access and cannot be limited.", "c": false}, {"t": "Make the container public", "w": "Gives everyone access.", "c": false}]}, {"k": "S", "q": "A storage account must be reachable only from subnet Sub1 in VNet1 over the Azure backbone with no private IP on the account. What should you configure?", "o": [{"t": "A private endpoint", "w": "Gives the account a private IP, which the requirement excludes.", "c": false}, {"t": "The Microsoft.Storage service endpoint on Sub1 and a virtual network rule", "w": "Service endpoint access to the public endpoint.", "c": true}, {"t": "An IP rule for 10.0.1.0/24", "w": "Private ranges are not allowed in IP rules.", "c": false}, {"t": "A user delegation SAS", "w": "Authorization, not network restriction.", "c": false}]}, {"k": "M", "q": "Which TWO are required to let domain users mount an Azure Files share with their identities?", "o": [{"t": "An identity source such as AD DS or Entra Domain Services enabled for the account", "w": "Needed for Kerberos authentication.", "c": true}, {"t": "A share-level RBAC role such as Storage File Data SMB Share Contributor", "w": "Grants share access.", "c": true}, {"t": "A user delegation SAS", "w": "Not used for SMB identity-based mounts.", "c": false}, {"t": "Blob versioning", "w": "Unrelated to Azure Files access.", "c": false}]}, {"k": "D", "q": "A SAS secured with Microsoft Entra credentials is a {0} SAS. To rotate keys without downtime, switch applications to {1} first.", "slots": [[{"t": "user delegation", "w": "Signed with a user delegation key.", "c": true}, {"t": "account", "w": "Signed with an account key.", "c": false}, {"t": "service", "w": "Signed with an account key.", "c": false}], [{"t": "a new storage account", "w": "Not needed.", "c": false}, {"t": "the other key", "w": "Apps use key2 while you regenerate key1.", "c": true}, {"t": "a SAS token", "w": "Still tied to the key that signed it.", "c": false}]]}, {"k": "Y", "q": "Your storage account firewall allows only subnet Sub1.", "st": [{"t": "A user outside Sub1 who has a valid SAS can access the data from the internet.", "a": false, "w": "The firewall still blocks traffic from non-allowed networks."}, {"t": "You can add the public IP 203.0.113.10 as an IP rule.", "a": true, "w": "Public IPv4 addresses are allowed."}, {"t": "You can add 192.168.1.0/24 as an IP rule.", "a": false, "w": "Private ranges are not allowed."}]}, {"k": "Y", "q": "You regenerate key1 for a storage account.", "st": [{"t": "SAS tokens signed with key1 stop working.", "a": true, "w": "They are invalidated."}, {"t": "User delegation SAS tokens are affected.", "a": false, "w": "They are signed by a user delegation key, not the account key."}, {"t": "Apps using key2 continue to work.", "a": true, "w": "key2 is unchanged."}]}]}, {"id": "x05", "title": "Configure and manage storage accounts", "terms": [["Storage account", "Namespace for Azure Storage data. Name: 3 to 24 characters, lowercase letters and numbers, globally unique."], ["General-purpose v2 (GPv2)", "Standard account type supporting blobs, files, queues, tables. Recommended default."], ["Premium block blobs", "SSD-backed account for low-latency block and append blobs."], ["Premium file shares", "SSD-backed account for Azure Files (SMB and NFS)."], ["Premium page blobs", "SSD-backed account for page blobs (VM disks)."], ["LRS", "3 synchronous copies in one datacenter. 11 nines durability."], ["ZRS", "3 synchronous copies across 3 availability zones. 12 nines."], ["GRS", "LRS in the primary region + asynchronous copy to the paired region (LRS). 16 nines."], ["GZRS", "ZRS in the primary + asynchronous copy to the secondary (LRS). 16 nines."], ["RA-GRS / RA-GZRS", "Adds read access to the secondary endpoint (`-secondary`)."], ["Customer-managed failover", "You trigger account failover to the secondary region. The account becomes LRS (or ZRS for GZRS) in the new primary."], ["Last Sync Time", "Property showing the point to which data is guaranteed replicated to the secondary."], ["Object replication", "Asynchronous copy of block blobs between a source and destination account by policy rules."], ["Blob versioning", "Automatically keeps prior versions of a blob (prerequisite for object replication)."], ["Change feed", "Log of changes to blobs (prerequisite on the source for object replication)."], ["Storage Service Encryption (SSE)", "Always-on encryption at rest with 256-bit AES."], ["Microsoft-managed keys (MMK)", "Default key management for SSE."], ["Customer-managed keys (CMK)", "Keys in Azure Key Vault or Managed HSM that you control. Key Vault needs soft delete and purge protection."], ["Infrastructure encryption", "A second layer of encryption at the service level. Must be enabled when the account is created."], ["Encryption scope", "Lets you use different keys for a container or individual blobs."], ["Azure Storage Explorer", "Desktop GUI to manage storage data on Windows, macOS and Linux."], ["AzCopy", "Command-line utility (v10) for fast copy and sync to and from storage."]], "fc": [["Storage account name rules", "3 to 24 chars, lowercase letters and numbers, globally unique."], ["Object replication prerequisites", "Versioning on source and destination, change feed on source."], ["LRS durability", "11 nines. ZRS 12 nines. GRS/GZRS 16 nines."], ["Account after failover is", "LRS (or ZRS when it was GZRS)."], ["Infrastructure encryption when enabled", "Only at creation."], ["CMK Key Vault requirements", "Soft delete and purge protection."], ["AzCopy command to authenticate with Entra ID", "azcopy login."], ["AzCopy sync direction", "One-way."]], "how": "### Creating an account\nChoose subscription, RG, name (unique), region, **performance** (Standard or Premium), **redundancy**, and later: networking, data protection, encryption. Endpoints are `https://<name>.blob.core.windows.net` (also `file`, `queue`, `table`, `dfs`).\n\n### Redundancy decision\n| Requirement | Choose |\n|---|---|\n| Cheapest, single datacenter is fine | LRS |\n| Survive a zone or datacenter failure | ZRS |\n| Survive a region failure | GRS or GZRS |\n| Read from secondary any time | RA-GRS or RA-GZRS |\n| Zone and region protection | GZRS / RA-GZRS |\n\nChange redundancy in **Configuration** (or with `az storage account update --sku`). Some changes are a live migration request; some require manual copy. **Premium** accounts support only LRS and ZRS. **Archive** tier is not available on ZRS, GZRS or RA-GZRS accounts.\n\n### Failover\nCustomer-managed failover for GRS/RA-GRS/GZRS/RA-GZRS makes the secondary the new primary. There is potential data loss since replication is asynchronous (check **Last Sync Time**). After failover the account is **LRS** and you must reconfigure geo-redundancy.\n\n### Object replication\nReplicates block blobs asynchronously by rules (container to container). Requirements: **versioning on source and destination**, **change feed on source**. Source and destination can be in different regions or subscriptions. The destination container is not writable by users. Useful to reduce read latency and for data distribution.\n\n### Encryption\n- **At rest**: always on, 256-bit AES, cannot be disabled. Default **MMK**. Optionally **CMK** with Key Vault (managed identity needs access: wrap/unwrap key). Key Vault must have **soft delete and purge protection**.\n- **Infrastructure encryption**: only at creation.\n- **In transit**: Secure transfer required (HTTPS), **minimum TLS version** setting.\n\n### Moving data\n**Storage Explorer**: sign in with Entra ID, key, SAS or connection string. **AzCopy**: authenticate with `azcopy login` (Entra ID) or a SAS; `copy` for transfers, `sync` for one-way sync, account-to-account server-side copy.", "lim": "| Option | Copies | Survives zone failure | Survives region failure | Readable secondary |\n|---|---|---|---|---|\n| LRS | 3 | No | No | n/a |\n| ZRS | 3 | Yes | No | n/a |\n| GRS | 6 | No (in primary) | Yes | No |\n| RA-GRS | 6 | No (in primary) | Yes | Yes |\n| GZRS | 6 | Yes | Yes | No |\n| RA-GZRS | 6 | Yes | Yes | Yes |\n\n| Account type | Supports | Redundancy |\n|---|---|---|\n| Standard GPv2 | Blob, File, Queue, Table, Disk | All |\n| Premium block blobs | Block and append blobs | LRS, ZRS |\n| Premium file shares | Azure Files | LRS, ZRS |\n| Premium page blobs | Page blobs | LRS (ZRS in some regions) |", "exam": "- Pick the right redundancy option and know which accounts support Archive and Premium.\n- Configure object replication and know prerequisites (versioning, change feed).\n- Configure customer-managed keys and know Key Vault prerequisites.\n- Use Storage Explorer and AzCopy (login, copy, sync) for data movement.", "stress": "- **Object replication needs versioning on both accounts and change feed on the source.**\n- **After failover the account is LRS.** Geo-redundancy must be re-enabled.\n- **GRS secondary is not readable;** only RA-GRS and RA-GZRS allow reads.\n- **ZRS does not give regional protection.** Pick GZRS for both.\n- **Premium accounts do not support GRS.**\n- **Archive tier not available with ZRS/GZRS/RA-GZRS.**\n- **Infrastructure encryption can only be enabled at account creation.**\n- **CMK Key Vault must have soft delete and purge protection** enabled.\n- **Storage account names are globally unique, lowercase and 3 to 24 characters.**\n- **AzCopy sync is one-way** from source to destination.", "cues": "### CLI\n```\naz storage account create -n stdemo123 -g rg -l westeurope --sku Standard_GZRS --kind StorageV2 --min-tls-version TLS1_2\naz storage account update -n stdemo123 -g rg --sku Standard_RAGZRS\naz storage account failover -n stdemo123 -g rg\naz storage account update -n stdemo123 -g rg --encryption-key-source Microsoft.Keyvault --encryption-key-vault <uri> --encryption-key-name key1\naz storage account or-policy create -g rg -n srcacct --destination-account dstacct --source-container src --destination-container dst\n```\n### AzCopy\n```\nazcopy login\nazcopy copy \"https://src.blob.core.windows.net/c?<SAS>\" \"https://dst.blob.core.windows.net/c?<SAS>\" --recursive\nazcopy sync \"C:\\data\" \"https://stdemo123.blob.core.windows.net/c?<SAS>\" --recursive\n```\n### PowerShell\n```\nNew-AzStorageAccount -ResourceGroupName rg -Name stdemo123 -Location westeurope -SkuName Standard_GRS -Kind StorageV2\nInvoke-AzStorageAccountFailover -ResourceGroupName rg -Name stdemo123\n```", "quiz": [{"k": "S", "q": "You need storage that survives a datacenter failure in the primary region and a regional outage, with read access to the secondary. Which redundancy?", "o": [{"t": "GRS", "w": "Not zone-redundant in the primary and the secondary is not readable.", "c": false}, {"t": "ZRS", "w": "No regional protection.", "c": false}, {"t": "RA-GZRS", "w": "Zones in primary, geo-copy, read access to the secondary.", "c": true}, {"t": "LRS", "w": "Single datacenter.", "c": false}]}, {"k": "S", "q": "You enable object replication from storage account A to B. The policy creation fails. What is a prerequisite you may have missed?", "o": [{"t": "Enable static website on A", "w": "Not needed.", "c": false}, {"t": "Enable blob versioning on both accounts and change feed on the source", "w": "Required prerequisites.", "c": true}, {"t": "Set both accounts to Premium", "w": "Not required.", "c": false}, {"t": "Enable infrastructure encryption on B", "w": "Not a prerequisite.", "c": false}]}, {"k": "M", "q": "Which TWO statements about customer-managed keys for a storage account are true?", "o": [{"t": "The Key Vault must have soft delete and purge protection enabled.", "w": "Required for CMK.", "c": true}, {"t": "The storage account uses a managed identity to access the key.", "w": "The identity needs wrap/unwrap permissions.", "c": true}, {"t": "You must delete the Microsoft-managed keys first.", "w": "Encryption stays on; you switch key source.", "c": false}, {"t": "CMK disables encryption in transit.", "w": "Unrelated.", "c": false}]}, {"k": "D", "q": "After a customer-managed failover a GRS account becomes {0}. Archive tier is not supported for {1} accounts.", "slots": [[{"t": "LRS", "w": "In the new primary region.", "c": true}, {"t": "GRS", "w": "Must be reconfigured.", "c": false}, {"t": "RA-GRS", "w": "Must be recon
