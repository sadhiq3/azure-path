<title>Azure Path</title>

<style>
/* Layout: single column, sticky progress header, five-tab bottom nav, full-screen quiz sheet. */
:root{
  --bg:#EDF4FA;--surface:#FFFFFF;--surface2:#E1ECF7;--ink:#0A2540;--muted:#4D6A86;--line:#CBDDEE;

  --warn-bg:#FFF0CC;--warn-line:#E2A100;--warn-ink:#583800;--exam-bg:#DFEEFF;--exam-line:#7FB6EE;
  --shadow:0 1px 2px rgba(10,37,64,.06),0 6px 18px rgba(10,37,64,.06);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'Figtree','Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07131E;--surface:#0E2033;--surface2:#16304A;--ink:#E6F1FB;--muted:#8FB1CE;--line:#244462;
  --brand:#4CB0FF;--brand-ink:#03223A;--brand-deep:#8CCBFF;--cyan:#3FD0F5;
  --good:#5BDB93;--good-bg:#0F3523;--bad:#FF8F84;--bad-bg:#42171A;
  --warn-bg:#3A2A06;--warn-line:#C99A12;--warn-ink:#FFD98A;--exam-bg:#0F2C4B;--exam-line:#2F6DA8;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07131E;--surface:#0E2033;--surface2:#16304A;--ink:#E6F1FB;--muted:#8FB1CE;--line:#244462;
  --brand:#4CB0FF;--brand-ink:#03223A;--brand-deep:#8CCBFF;--cyan:#3FD0F5;
  --good:#5BDB93;--good-bg:#0F3523;--bad:#FF8F84;--bad-bg:#42171A;
  --warn-bg:#3A2A06;--warn-line:#C99A12;--warn-ink:#FFD98A;--exam-bg:#0F2C4B;--exam-line:#2F6DA8;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
h4{margin:14px 0 4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
p{margin:8px 0}ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
code{font-family:var(--mono);font-size:.88em;background:var(--surface2);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
b{font-weight:650}
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px}
.brand{font:700 18px var(--display);display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.logo{width:26px;height:26px;flex:none}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px;min-height:36px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--brand-deep);box-shadow:var(--shadow)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}

.pline{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--muted);font-weight:600}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;font-size:11px;font-weight:600;color:var(--muted);border-radius:12px}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--brand);background:var(--exam-bg)}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px;padding-block:14px}
.muted{color:var(--muted)}.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:650;min-height:46px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-weight:600;font-size:13px;min-height:38px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
input[type=search],input[type=date],select,textarea{width:100%;min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
/* learn */
.intro h2{font-size:20px}
.intro .facts{font-size:13px;color:var(--muted);margin-top:4px}
.note{font-size:13px;color:var(--muted);margin-top:8px;border-left:3px solid var(--cyan);padding-left:10px}
details>summary{list-style:none;cursor:pointer}

summary .chev{width:18px;height:18px;flex:none;transition:transform .25s;stroke:var(--muted);fill:none;stroke-width:2.2}

.dom{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.dom>summary{display:flex;align-items:center;gap:10px;padding:14px;min-height:60px}
.dom>summary .t{flex:1;min-width:0;font:700 16px var(--display)}

.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--exam-bg);color:var(--brand-deep);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.dbody{padding:0 10px 10px;display:flex;flex-direction:column;gap:8px}
.topic{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.topic>summary{display:flex;align-items:center;gap:10px;padding:12px;min-height:56px}
.topic>summary .t{flex:1;min-width:0;font-weight:650;line-height:1.3}
.topic>summary .t small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.tb{padding:4px 12px 14px;display:flex;flex-direction:column;gap:10px}
.sec{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sec>summary{display:flex;align-items:center;gap:8px;padding:11px 12px;font-weight:650;min-height:48px}
.sec>summary span{flex:1}
.sec .sb{padding:0 12px 12px}

dt{font-weight:700;color:var(--brand-deep)}dd{margin:0 0 2px}
.tbl{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;font-size:13px;min-width:100%}
th,td{padding:7px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--surface2);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
.sec.exam{background:var(--exam-bg);border-color:var(--exam-line)}
.sec.stress{background:var(--warn-bg);border:2px solid var(--warn-line);color:var(--warn-ink)}

.code{position:relative;margin:8px 0}

.cp{position:absolute;right:6px;top:6px;border:1px solid #2C4C6B;background:#14304D;color:#CFE8FF;border-radius:8px;font-size:12px;padding:4px 9px;min-height:30px}
.obj{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.obj:last-child{border-bottom:0}
.obj .tx{flex:1;min-width:0;font-size:14px}
.st{border:1px solid var(--line);border-radius:99px;font-size:12px;font-weight:700;padding:6px 11px;min-height:36px;background:var(--surface);white-space:nowrap;color:var(--muted)}
.st[data-v="1"]{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-line)}

.meter{display:flex;gap:3px;margin-top:5px}.meter i{flex:1;height:5px;border-radius:3px;background:var(--surface2)}.meter i.l{background:var(--warn-line)}.meter i.c{background:var(--good)}
.hit{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
mark{background:#FFE08A;color:#3B2A00;border-radius:3px;padding:0 2px}
/* flashcards */
.fc{perspective:1200px;cursor:pointer}
.fci{display:grid;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.8,.3,1)}
.fci.flip{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:240px;border-radius:20px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:8px;border:1px solid var(--line);box-shadow:var(--shadow)}
.face.front{background:linear-gradient(160deg,var(--brand),var(--brand-deep));color:#fff}
.face.front small{color:#CFE8FF;font-weight:600}
.face.front h3{font-size:26px}
.face.back{background:var(--surface);transform:rotateY(180deg)}
.face.back small{color:var(--muted);font-weight:600}
.face.back div{font-size:16px}
.hint{text-align:center;font-size:12px;color:var(--muted)}
.fcbtn{flex:1;min-height:54px;border-radius:14px;font-weight:700;border:2px solid}
.fcbtn.rv{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.fcbtn.kn{border-color:var(--good);background:var(--good-bg);color:var(--good)}
/* session */
#sess[hidden]{display:none!important}
#sess{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}

.stitle{flex:1;min-width:0;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.timer{font:600 16px var(--mono);padding:6px 10px;border-radius:10px;background:var(--surface2);font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.sbody{flex:1;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px))}
.sin{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sfoot{border-top:1px solid var(--line);background:var(--surface);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sfoot .in{max-width:720px;margin:0 auto;display:flex;gap:8px}
.sfoot .btn{flex:1}
.qtext{font-size:16.5px;font-weight:550;line-height:1.5}
.case{background:var(--surface2);border-radius:12px;padding:12px;font-size:14px}
.qtype{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-deep)}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;min-height:54px}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.m .l{border-radius:8px}
.opt.sel{border-color:var(--brand);background:var(--exam-bg)}

.opt.ok{border-color:var(--good);background:var(--good-bg)}.opt.ok .l{background:var(--good);border-color:var(--good);color:#fff}

.why{display:block;font-size:13px;color:var(--muted);margin-top:5px;font-weight:450}
.verdict{border-radius:14px;padding:12px;font-weight:700}
.verdict.good{background:var(--good-bg);color:var(--good)}.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.dd select{display:inline-block;width:auto;min-width:140px;max-width:100%;min-height:40px;padding:4px 8px;margin:2px 3px;font-weight:600}
.dd select.ok{border-color:var(--good);background:var(--good-bg)}.dd select.no{border-color:var(--bad);background:var(--bad-bg)}
.ynr{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ynr .bt{display:flex;gap:8px}.ynr .bt button{flex:1;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-weight:700}
.ynr .bt button.sel{border-color:var(--brand);background:var(--exam-bg)}
.ynr .bt button.ok{border-color:var(--good);background:var(--good-bg)}.ynr .bt button.no{border-color:var(--bad);background:var(--bad-bg)}
.ordl{display:flex;flex-direction:column;gap:6px;min-height:20px}
.ordi{display:flex;gap:8px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px}
.ordi .n{width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.ordi.ok{border-color:var(--good);background:var(--good-bg)}.ordi.no{border-color:var(--bad);background:var(--bad-bg)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.pal button{min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;position:relative}
.pal button.a{background:var(--exam-bg);border-color:var(--brand)}
.pal button.fl::after{content:"⚑";position:absolute;top:-6px;right:-2px;color:var(--warn-line);font-size:14px}
.ring{width:150px;height:150px;margin:0 auto;display:block}
.ring text{font:700 30px var(--display);fill:var(--ink)}
.dbar{display:grid;gap:4px;margin:8px 0}
.dbar .lb{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.bars{display:grid;gap:4px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:650;font-size:13px}
.badge.off{opacity:.45;filter:grayscale(1)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font:700 22px var(--display)}.stat span{font-size:11px;color:var(--muted);font-weight:600}
.dots{display:flex;gap:6px}.dots i{width:22px;height:22px;border-radius:7px;background:var(--surface2)}.dots i.on{background:linear-gradient(135deg,#F7A600,#FF6B2C)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:650;max-width:min(92vw,420px);text-align:center;transition:.35s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.conf{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}

@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}

@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
.fade{animation:fade .3s ease}

/* Supabase account and cloud-sync status */
.cloudbar{max-width:720px;margin:10px auto 0;padding:0 16px}
.cloudbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;box-shadow:var(--shadow)}

const OUT={"az900": {"id": "az900", "code": "AZ-900", "name": "Azure Fundamentals", "mins": 45, "facts": "45 min · 40–60 questions · pass 700/1000", "note": "Skills outline as of July 20, 2026 (page updated June 22, 2026). Domain names and weights are unchanged. Microsoft marks three groups as \"Minor\" changes without listing details: compute and networking services, managing and deploying resources, and monitoring tools. Current wording includes sovereign regions, Azure Virtual Desktop, defense in depth, Microsoft Purview, Azure Arc, serverless and cloud pricing models.", "domains": [{"n": "Describe cloud concepts", "w": [25, 30], "groups": [{"t": "f01", "n": "Describe cloud computing", "items": ["Define cloud computing", "Describe the shared responsibility model", "Define cloud models, including public, private, and hybrid", "Identify appropriate use cases for each cloud model", "Describe the consumption-based model", "Compare cloud pricing models", "Describe serverless"]}, {"t": "f02", "n": "Describe the benefits of using cloud services", "items": ["Describe the benefits of high availability and scalability in the cloud", "Describe the benefits of reliability and predictability in the cloud", "Describe the benefits of security and governance in the cloud", "Describe the benefits of manageability in the cloud"]}, {"t": "f03", "n": "Describe cloud service types", "items": ["Describe infrastructure as a service (IaaS)", "Describe platform as a service (PaaS)", "Describe software as a service (SaaS)", "Identify appropriate use cases for each cloud service type (IaaS, PaaS, and SaaS)"]}]}, {"n": "Describe Azure architecture and services", "w": [35, 40], "groups": [{"t": "f04", "n": "Describe the core architectural components of Azure", "items": ["Describe Azure regions, region pairs, and sovereign regions", "Describe availability zones", "Describe Azure datacenters", "Describe Azure resources and resource groups", "Describe subscriptions", "Describe management groups ribe the purpose of tags"]}, {"t": "f09", "n": "Describe features and tools in Azure for governance and compliance", "items": ["Describe the purpose of Microsoft Purview in Azure", "Describe the purpose of Azure Policy", "Describe the purpose of resource locks"]}, {"t": "f10", "n": "Describe features and tools for managing and deploying Azure resources", "items": ["Describe the Azure portal", "Describe Azure Cloud Shell, Azure CLI, and Azure PowerShell", "Describe the purpose of Azure Arc", "Describe infrastructure as code (IaC)", "Describe Azure Resource Manager (ARM) and ARM templates"]}, {"t": "f11", "n": "Describe monitoring tools in Azure", "items": ["Describe the purpose of Azure Advisor", "Describe Azure Service Health", "Describe Azure Monitor, including Log Analytics, Azure Monitor alerts, and Azure Monitor Application Insights"]}]}]}, "az104": {"id": "az104", "code": "AZ-104", "name": "Azure Administrator", "mins": 100, "facts": "100 min · ~40–60 questions · pass 700/1000", "note": "The study guide I could retrieve shows the outline \"as of October 26, 2023\", the current published version. The only change from the prior version was the rename \"Azure AD\" to \"Microsoft Entra\" in the user and group objective, plus a revised audience profile. The certification page was last updated April 17, 2026 with no announced change or retirement. Recheck the live study guide before booking. Practice Assessments on Learn are now on AI Skills Navigator.", "domains": [{"n": "Manage Azure identities and governance", "w": [20, 25], "groups": [{"t": "x01", "n": "Manage Microsoft Entra users and groups", "items": ["Create users and groups", "Manage user and group properties", "Manage licenses in Microsoft Entra ID", "Manage external users", "Configure self-service password reset (SSPR)"]}, {"t": "x02", "n": "Manage access to Azure resources", "items": ["Manage built-in Azure roles", "Assign roles at different scopes", "Interpret access assignments"]}, {"t": "x03", "n": "Manage Azure subscriptions and governance", "items": ["Implement and manage Azure Policy", "Configure resource locks", "Apply and manage tags on resources", "Manage resource groups", "Manage subscriptions", "Manage costs by using alerts, budgets, and Azure Advisor recommendations", "Configure management groups"]}]}, {"n": "Implement and manage storage", "w": [15, 20], "groups": [{"t": "x04", "n": "Configure access to storage", "items": ["Configure Azure Storage firewalls and virtual networks", "Create and use shared access signature (SAS) tokens", "Configure stored access policies", "Manage access keys", "Configure identity-based access for Azure Files"]}, {"t": "x05", "n": "Configure and manage storage accounts", "items": ["Create and configure storage accounts", "Configure Azure Storage redundancy", "Configure object replication", "Configure storage account encryption", "Manage data by using Azure Storage Explorer and AzCopy"]}, {"t": "x06", "n": "Configure Azure Files and Azure Blob Storage", "items": ["Create and configure a file share in Azure Storage", "Create and configure a container in Blob Storage", "Configure storage tiers", "Configure snapshots and soft delete for Azure Files", "Configure blob lifecycle management", "Configure blob versioning"]}]}, {"n": "Deploy and manage Azure compute resources", "w": [20, 25], "groups": [{"t": "x07", "n": "Automate deployment with ARM templates or Bicep files", "items": ["Interpret an Azure Resource Manager template or a Bicep file", "Modify an existing Azure Resource Manager template", "Modify an existing Bicep file", "Deploy resources by using an Azure Resource Manager template or a Bicep file", "Export a deployment as an Azure Resource Manager template or convert an Azure Resource Manager template to a Bicep file"]}, {"t": "x08", "n": "Create and configure virtual machines", "items": ["Create a virtual machine", "Configure Azure Disk Encryption", "Move a virtual machine to another resource group, subscription, or region", "Manage virtual machine sizes", "Manage virtual machine disks", "Deploy virtual machines to availability zones and availability sets", "Deploy and configure an Azure Virtual Machine Scale Sets"]}, {"t": "x09", "n": "Provision and manage containers in the Azure portal", "items": ["Create and manage an Azure container registry", "Provision a container by using Azure Container Instances", "Provision a container by using Azure Container Apps", "Manage sizing and scaling for containers, including Azure Container Instances and Azure Container Apps"]}, {"t": "x10", "n": "Create and configure Azure App Service", "items": ["Provision an App Service plan", "Configure scaling for an App Service plan", "Create an App Service", "Configure certificates and Transport Layer Security (TLS) for an App Service", "Map an existing custom DNS name to an App Service", "Configure backup for an App Service", "Configure networking settings for an App Service", "Configure deployment slots for an App Service"]}]}, {"n": "Implement and manage virtual networking", "w": [15, 20], "groups": [{"t": "x11", "n": "Configure and manage virtual networks in Azure", "items": ["Create and configure virtual networks and subnets", "Create and configure virtual network peering", "Configure public IP addresses", "Configure user-defined network routes", "Troubleshoot network connectivity"]}, {"t": "x12", "n": "Configure secure access to virtual networks", "items": ["Create and configure network security groups (NSGs) and application security groups", "Evaluate effective security rules in NSGs", "Implement Azure Bastion", "Configure service endpoints for Azure platform as a service (PaaS)", "Configure private endpoints for Azure PaaS"]}, {"t": "x13", "n": "Configure name resolution and load balancing", "items": ["Configure Azure DNS", "Configure an internal or public load balancer", "Troubleshoot load balancing"]}]}, {"n": "Monitor and maintain Azure resources", "w": [10, 15], "groups": [{"t": "x14", "n": "Monitor resources in Azure", "items": ["Interpret metrics in Azure Monitor", "Configure log settings in Azure Monitor", "Query and analyze logs in Azure Monitor", "Set up alert rules, action groups, and alert processing rules in Azure Monitor", "Configure and interpret monitoring of virtual machines, storage accounts, and networks by using Azure Monitor Insights", "Use Azure Network Watcher and Connection Monitor"]}, {"t": "x15", "n": "Implement backup and recovery", "items": ["Create a Recovery Services vault", "Create an Azure Backup vault", "Create and configure a backup policy", "Perform backup and restore operations by using Azure Backup", "Configure Azure Site Recovery for Azure resources", "Perform a failover to a secondary region by using Site Recovery", "Configure and interpret reports and alerts for backups"]}]}]}};
const COURSE=[{"id": "f01", "title": "Describe cloud computing", "terms": [["Cloud computing", "Delivery of computing services (servers, storage, databases, networking, software, analytics, AI) over the internet, on demand, with pay-as-you-go pricing."], ["Public cloud", "Resources owned and operated by a provider (Microsoft) and shared by many customers (tenants) over the internet. No hardware for you to buy."], ["Private cloud", "Cloud resources used by one organization only, hosted in its own datacenter or by a third party. You buy and maintain the hardware."], ["Hybrid cloud", "A mix of public and private (or on-premises) environments that are connected and can share data and apps."], ["Multi-cloud", "Using more than one public cloud provider (for example Azure and AWS). Not the same as hybrid."], ["Shared responsibility model", "Defines which security and management tasks belong to the cloud provider and which to the customer. The split depends on the service type (IaaS, PaaS, SaaS) or on-premises."], ["CapEx (capital expenditure)", "Up-front spend on physical assets such as servers and datacenters. Depreciated over time. Typical of on-premises."], ["OpEx (operational expenditure)", "Ongoing spend on services as you use them. Typical of cloud. No up-front cost."], ["Consumption-based model", "You pay only for the resources you use, billed per unit (per second, per GB, per execution). No upfront commitment, no termination fees."], ["Pay-as-you-go", "Default Azure pricing: pay for what you use at list price, with no commitment."], ["Reserved Instance (RI)", "Commit to 1 or 3 years of a specific resource (such as a VM size in a region) for a large discount (up to about 72%)."], ["Savings plan for compute", "Commit to a fixed hourly spend for 1 or 3 years. The discount applies across eligible compute (VMs, App Service, Functions Premium, containers) and regions. More flexible than RIs, usually slightly smaller discount."], ["Spot VM", "Unused Azure capacity at deep discounts (up to about 90%). Azure can evict the VM with short notice when it needs the capacity back. For interruptible workloads only."], ["Azure Hybrid Benefit", "Use existing Windows Server or SQL Server licenses with Software Assurance (and some Linux subscriptions) on Azure to cut licensing cost."], ["Serverless", "Cloud model where the provider manages all servers. You deploy code or workflows, scale is automatic (including to zero), and you pay per execution or resource time."], ["Elasticity", "Automatically adding and removing resources to match demand in both directions."], ["Tenant", "A dedicated, isolated instance of Microsoft Entra ID that represents an organization. Not the same as a subscription."]], "fc": [["Always the customer's responsibility (3)", "Information and data, devices, accounts and identities."], ["Always Microsoft's responsibility (3)", "Physical datacenter, physical network, physical hosts."], ["Who patches the OS in IaaS?", "The customer."], ["Who patches the OS in PaaS?", "Microsoft."], ["Max Spot VM discount", "Up to about 90%, with possible eviction."], ["Max Reserved Instance discount", "Up to about 72% for 1 or 3 year terms."], ["Hybrid vs multi-cloud", "Hybrid = private + public. Multi-cloud = more than one public provider."]], "how": "### Why the cloud exists\nRunning your own datacenter means buying capacity for peak load (CapEx), paying for it when idle, and waiting weeks for hardware. Cloud turns that into rented capacity you can create in minutes and delete when finished (OpEx). Microsoft owns the datacenters; you rent slices.\n\n### Cloud models (deployment models)\n- **Public**: lowest cost, fastest start, near-unlimited scale. Data lives on shared infrastructure (logically isolated).\n- **Private**: full control and compliance isolation, but you own the cost and maintenance.\n- **Hybrid**: keep regulated or legacy systems on-premises, use public cloud for scale, burst capacity, backup and DR.\n- Use hybrid when you cannot move everything (latency to factory floor, data residency, legacy hardware) or when you want to burst into the cloud at peak.\n\n### Shared responsibility model\nResponsibility moves toward Microsoft as you move from on-premises to IaaS to PaaS to SaaS.\n\n| Responsibility | On-prem | IaaS | PaaS | SaaS |\n|---|---|---|---|---|\n| Information and data | Customer | Customer | Customer | Customer |\n| Devices (mobile and PCs) | Customer | Customer | Customer | Customer |\n| Accounts and identities | Customer | Customer | Customer | Customer |\n| Identity and directory infrastructure | Customer | Shared | Shared | Microsoft |\n| Applications | Customer | Customer | Shared | Microsoft |\n| Network controls | Customer | Customer | Shared | Microsoft |\n| Operating system | Customer | Customer | Microsoft | Microsoft |\n| Physical hosts | Customer | Microsoft | Microsoft | Microsoft |\n| Physical network | Customer | Microsoft | Microsoft | Microsoft |\n| Physical datacenter | Customer | Microsoft | Microsoft | Microsoft |\n\n### Consumption-based pricing\nYou are billed for actual use. Stop or delete a resource and charges for it stop (for a VM: deallocate, not just shut down inside the OS). Costs are variable, so monitor them.\n\n### Serverless\nServers still exist, you just never manage them. Examples: **Azure Functions** (event-triggered code), **Azure Logic Apps** (workflow automation), and Azure Container Apps (can scale to zero). Key traits: event-driven, automatic scaling, pay per execution, no patching.", "lim": "| Pricing option | Commitment | Typical saving | Best for |\n|---|---|---|---|\n| Pay-as-you-go | None | 0% | Unpredictable, short-lived |\n| Reserved Instance | 1 or 3 years, specific VM size and region | up to ~72% | Steady-state, known VMs |\n| Savings plan for compute | 1 or 3 years, fixed $/hour | up to ~65% | Steady spend, changing VM types or regions |\n| Spot VM | None, can be evicted | up to ~90% | Batch, dev/test, interruptible |\n| Azure Hybrid Benefit | Existing license with Software Assurance | stacks with RI | Windows Server / SQL Server |\n\n| Model | Who owns hardware | Cost model | Scale |\n|---|---|---|---|\n| Public | Provider | OpEx | Near unlimited |\n| Private | You | CapEx | Limited to your capacity |\n| Hybrid | Both | Mix | Burst to public |", "exam": "- Name what is **always** the customer's responsibility: data, endpoints/devices, accounts and identities.\n- Name what is **always** Microsoft's: physical datacenter, physical network, physical hosts.\n- Pick the right cloud model from a scenario (regulation, legacy, burst).\n- Compare CapEx and OpEx, and recognise consumption-based billing.\n- Choose the right pricing option (Spot, Reserved, Hybrid Benefit) from a scenario.\n- Define serverless and name Azure Functions and Logic Apps as examples.", "stress": "- **Hybrid is not multi-cloud.** Hybrid = private/on-prem + public. Multi-cloud = two or more public clouds.\n- **Customer always owns data, identities and devices**, even in SaaS. Microsoft does not secure your users' passwords or data classification for you.\n- **OS patching**: customer in IaaS, Microsoft in PaaS and SaaS.\n- **Spot VMs can be evicted.** Never the answer for a workload that must not be interrupted.\n- **Reserved Instance vs savings plan**: RI is locked to a VM size/region; savings plan is flexible across compute.\n- **Hybrid Benefit needs Software Assurance** (or qualifying subscription) licenses.\n- **Serverless does not mean no servers**; it means you do not manage them.\n- A stopped (not deallocated) VM can still be billed for compute.", "cues": "", "quiz": [{"k": "S", "q": "Which responsibility remains with the customer in every cloud service type, including SaaS?", "o": [{"t": "Physical host security", "w": "Microsoft always owns physical hosts in IaaS, PaaS and SaaS.", "c": false}, {"t": "Information and data, plus accounts and identities", "w": "These are never transferred to the provider regardless of service type.", "c": true}, {"t": "Operating system patching", "w": "Customer only in IaaS. Microsoft handles it in PaaS and SaaS.", "c": false}, {"t": "Physical network", "w": "Always Microsoft in the cloud.", "c": false}]}, {"k": "S", "q": "A company runs a nightly batch job that can be restarted if it stops. It wants the lowest possible compute price. Which option fits best?", "o": [{"t": "Reserved Instance", "w": "Needs a 1 or 3 year commitment and suits steady, always-on workloads, not the cheapest for interruptible work.", "c": false}, {"t": "Azure Spot VMs", "w": "Deep discount on unused capacity, and the job tolerates eviction.", "c": true}, {"t": "Pay-as-you-go on a large VM", "w": "Full list price, the most expensive of the four.", "c": false}, {"t": "Azure Hybrid Benefit alone", "w": "Reduces licensing cost only, and does not apply to Linux workloads without a qualifying subscription.", "c": false}]}, {"k": "M", "q": "Which TWO statements about the consumption-based model are true?", "o": [{"t": "You pay only for the resources you use.", "w": "This is the definition of the model.", "c": true}, {"t": "It converts up-front capital cost into operational cost.", "w": "CapEx becomes OpEx.", "c": true}, {"t": "It requires a 3 year commitment.", "w": "Commitments are Reserved Instances or savings plans, not the consumption model itself.", "c": false}, {"t": "Costs are always fixed and predictable.", "w": "Costs vary with usage, so budgets and alerts are recommended.", "c": false}]}, {"k": "D", "q": "Using Azure for some workloads while keeping others in your own datacenter is a {0} cloud. Using Azure and another public provider together is called {1}.", "slots": [[{"t": "public", "w": "Public means only the provider's shared cloud.", "c": false}, {"t": "hybrid", "w": "Hybrid connects on-premises or private with public cloud.", "c": true}, {"t": "community", "w": "Not one of the three AZ-900 models.", "c": false}], [{"t": "hybrid cloud", "w": "Hybrid involves a private or on-premises piece.", "c": false}, {"t": "multi-cloud", "w": "More than one public cloud provider.", "c": true}, {"t": "serverless", "w": "A compute model, not a deployment model.", "c": false}]]}, {"k": "Y", "q": "Fabrikam moves a payroll web app to a PaaS service. It still runs some servers in its own datacenter.", "st": [{"t": "Fabrikam is responsible for patching the operating system of the PaaS hosts.", "a": false, "w": "In PaaS the provider manages the OS."}, {"t": "Fabrikam remains responsible for the payroll data it stores.", "a": true, "w": "Data is always the customer's responsibility."}, {"t": "Combining its datacenter with Azure is a hybrid cloud.", "a": true, "w": "Private/on-premises plus public equals hybrid."}]}]}, {"id": "f02", "title": "Describe the benefits of using cloud services", "terms": [["High availability (HA)", "Design that keeps a service running with minimal downtime, usually by removing single points of failure (redundant instances across zones)."], ["SLA (Service Level Agreement)", "Microsoft's commitment on uptime for a service, such as 99.9% or 99.99%. Missing it can earn service credits."], ["Composite SLA", "The combined availability of a solution built from several services. Calculated by multiplying individual SLAs, so it is lower than the weakest one when services are chained."], ["Scalability", "Ability to handle growing load by adding resources."], ["Vertical scaling (scale up/down)", "Making one instance bigger or smaller (more CPU or RAM)."], ["Horizontal scaling (scale out/in)", "Adding or removing instances."], ["Autoscale", "Automatic scale-out and scale-in based on rules or schedule."], ["Elasticity", "Scaling out and back in automatically so you pay only for what you need."], ["Reliability", "A system recovers from failures and keeps working. Built on redundancy, geo-distribution and self-healing."], ["Predictability", "Consistent performance and consistent cost that you can forecast."], ["Governance", "Rules and controls (policy, tagging, compliance) that keep cloud use within organisational standards."], ["Manageability", "Ease of managing and monitoring resources, including management of the cloud (portal, CLI, templates) and management in the cloud (scaling, alerts)."], ["Disaster recovery (DR)", "Plan and tooling to restore service after a major outage."], ["Economies of scale", "Lower unit cost because the provider buys and runs infrastructure at huge volume."]], "fc": [["Scale up vs scale out", "Up = bigger VM (vertical). Out = more VMs (horizontal)."], ["Composite SLA formula", "Multiply the SLAs of the chained services."], ["99.9% SLA allows about", "43.8 minutes of downtime per month."], ["99.99% SLA allows about", "4.4 minutes of downtime per month."], ["Management OF the cloud", "Autoscale, templates, monitoring (cloud-side features)."], ["Management IN the cloud", "Portal, CLI, PowerShell, APIs (how you manage resources)."]], "how": "### High availability\nSpread workloads across **availability zones** or regions so one failure does not take the service down. Higher SLAs need more redundancy and cost more.\n\n### Scalability and elasticity\n- **Vertical**: bigger VM. Simple, but has an upper limit and often needs a restart.\n- **Horizontal**: more instances behind a load balancer. Preferred for cloud-native design.\n- **Autoscale** handles spikes (Black Friday) and removes capacity afterwards so you stop paying.\n\n### Reliability and predictability\n- Reliability: redundancy, multiple regions, auto-healing, backups.\n- Predictability of **performance**: load balancing and autoscale keep response times stable.\n- Predictability of **cost**: pricing calculator, TCO calculator, budgets, reservations.\n\n### Security and governance\nCloud gives you built-in security tooling (Microsoft Defender for Cloud, Entra ID, DDoS protection, encryption at rest) and governance (Azure Policy, RBAC, locks, tags). Compliance certifications are inherited from the platform.\n\n### Manageability\n- **Management of the cloud**: autoscale, templates (IaC), monitoring and alerts.\n- **Management in the cloud**: portal, CLI, PowerShell, REST APIs, Cloud Shell.", "lim": "| SLA | Max downtime per month (approx.) |\n|---|---|\n| 99% | ~7.3 hours |\n| 99.9% | ~43.8 minutes |\n| 99.95% | ~21.9 minutes |\n| 99.99% | ~4.4 minutes |\n\n| Scaling | Action | Downtime risk | Limit |\n|---|---|---|---|\n| Vertical | Resize VM | Usually restart | Largest VM size |\n| Horizontal | Add instances | None | Quota and design |", "exam": "- Distinguish **scalability** (can grow) from **elasticity** (grows and shrinks automatically).\n- Match scenarios to **vertical** vs **horizontal** scaling.\n- Identify HA, reliability, predictability, security/governance and manageability benefits from scenarios.\n- Know that **composite SLA** is calculated by multiplying SLAs of dependent services.\n- Know the difference between management **of** the cloud and management **in** the cloud.", "stress": "- **Composite SLA drops** when you chain services: 99.95% × 99.99% is about 99.94%.\n- **Scale up** = bigger machine. **Scale out** = more machines. The exam loves swapping these.\n- **Elasticity ≠ scalability.** Only elasticity implies automatic shrink.\n- **Reliability** is about recovering from failure; **availability** is about uptime. Scenarios with \"recover\" and \"multiple regions\" point to reliability or DR.\n- **Predictability** has two flavours: performance and cost.", "cues": "", "quiz": [{"k": "S", "q": "A retailer's site slows down every holiday season. It wants capacity to be added automatically and removed afterwards. Which benefit does this describe?", "o": [{"t": "High availability", "w": "HA is about staying up through failures, not matching load.", "c": false}, {"t": "Predictability of cost", "w": "Cost forecasting is a different benefit.", "c": false}, {"t": "Elasticity", "w": "Resources grow and shrink automatically with demand.", "c": true}, {"t": "Disaster recovery", "w": "DR restores service after a major outage.", "c": false}]}, {"k": "S", "q": "You change a VM from 4 vCPU to 16 vCPU to handle more load. What is this?", "o": [{"t": "Horizontal scaling", "w": "That would be adding more instances.", "c": false}, {"t": "Vertical scaling (scale up)", "w": "One instance becomes bigger.", "c": true}, {"t": "Autoscale-in", "w": "That removes instances.", "c": false}, {"t": "Failover", "w": "Switching to a standby, not resizing.", "c": false}]}, {"k": "D", "q": "An app depends on a service with a 99.95% SLA and a database with a 99.99% SLA. The composite SLA is {0} than 99.95%. Doubling a VM size is {1} scaling.", "slots": [[{"t": "higher", "w": "Chained dependencies multiply availabilities, so the result drops.", "c": false}, {"t": "lower", "w": "0.9995 × 0.9999 ≈ 0.9994.", "c": true}, {"t": "exactly equal to", "w": "Only true if one service were 100%.", "c": false}], [{"t": "vertical", "w": "A bigger instance is vertical (scale up).", "c": true}, {"t": "horizontal", "w": "Horizontal means adding instances.", "c": false}, {"t": "elastic", "w": "Elasticity describes automatic scale in both directions, not the type of resize.", "c": false}]]}, {"k": "M", "q": "Which TWO items are examples of management OF the cloud?", "o": [{"t": "Autoscaling a web tier", "w": "Cloud-side automation features.", "c": true}, {"t": "Deploying with a template (infrastructure as code)", "w": "Automating resource creation is cloud management.", "c": true}, {"t": "Signing in with the Azure portal", "w": "This is a tool you use to manage resources (management in the cloud).", "c": false}, {"t": "Running az vm list", "w": "A CLI command is a management-in-the-cloud interface.", "c": false}]}, {"k": "Y", "q": "A company must keep its order system online even if one datacenter fails.", "st": [{"t": "Deploying across multiple availability zones supports high availability.", "a": true, "w": "Zones are physically separate datacenters in a region."}, {"t": "Placing all VMs in one zone but making them larger improves availability.", "a": false, "w": "Larger VMs do not remove the single point of failure."}, {"t": "Autoscale is an example of elasticity.", "a": true, "w": "Automatic scale-out and scale-in."}]}]}, {"id": "f03", "title": "Describe cloud service types", "terms": [["IaaS (Infrastructure as a Service)", "You rent virtualized compute, storage and networking. You manage the OS, middleware and apps. Example: Azure Virtual Machines."], ["PaaS (Platform as a Service)", "Managed platform for building and running apps. Provider manages OS, runtime and infrastructure. Example: Azure App Service, Azure SQL Database."], ["SaaS (Software as a Service)", "Complete software delivered over the internet, managed by the provider. Example: Microsoft 365, Dynamics 365."], ["Lift and shift", "Migrating workloads to cloud VMs with minimal change (typical IaaS use)."], ["Managed service", "A service where the provider handles patching, backup and high availability."], ["Azure Virtual Machines", "IaaS compute with full control of the guest OS."], ["Azure App Service", "PaaS for web apps, APIs and mobile back ends."], ["Azure SQL Database", "PaaS relational database managed by Microsoft."], ["Azure Functions", "Serverless, event-driven compute (often grouped with PaaS)."], ["Microsoft 365", "SaaS productivity suite (Exchange Online, Teams, SharePoint, Office apps)."], ["Dynamics 365", "SaaS business applications (CRM and ERP)."]], "fc": [["IaaS example", "Azure Virtual Machines."], ["PaaS examples", "Azure App Service, Azure SQL Database."], ["SaaS examples", "Microsoft 365, Dynamics 365."], ["Who manages the OS in IaaS?", "The customer."], ["Lift and shift usually means", "IaaS."], ["SQL Server on a VM is", "IaaS."]], "how": "### The stack\nThink of layers: datacenter, network, storage, servers, virtualization, OS, middleware, runtime, data, application. On-premises you manage all. Each service type hands more layers to Microsoft.\n\n### IaaS\n- You get a VM (or storage, network). You install, patch and secure the OS and the apps.\n- Why: full control, lift and shift of legacy apps, custom software, dev/test, disaster recovery.\n- Trade-off: most management effort for you.\n\n### PaaS\n- You deploy code or data. Microsoft runs the OS, patching, scaling and platform HA.\n- Why: faster development, no OS management, built-in scaling and DevOps integration.\n- Trade-off: less control over the underlying OS and some runtime limits.\n\n### SaaS\n- You consume the application. You manage users, data, configuration.\n- Why: no deployment, instant start, subscription model.\n- Trade-off: least customization.\n\n### Choosing\n- Need OS-level control or a legacy app? **IaaS**.\n- Just want to run code or a database without servers? **PaaS**.\n- Want a finished product like email? **SaaS**.", "lim": "| | IaaS | PaaS | SaaS |\n|---|---|---|---|\n| Control | Highest | Medium | Lowest |\n| Your effort | Highest | Medium | Lowest |\n| Azure example | Virtual Machines | App Service, Azure SQL Database | Microsoft 365 |\n| You patch the OS | Yes | No | No |\n| Typical use | Lift and shift, custom stacks | App dev, APIs, databases | Email, CRM, collaboration |", "exam": "- Classify a named service or scenario as IaaS, PaaS or SaaS.\n- Match use cases: lift and shift (IaaS), develop and deploy apps without managing servers (PaaS), ready-made software (SaaS).\n- Tie service type to the shared responsibility model.", "stress": "- **Azure SQL Database is PaaS; SQL Server on a VM is IaaS.** Same engine, different responsibility.\n- **Azure Virtual Desktop and VMs are IaaS** (you manage the OS images); Microsoft 365 is SaaS.\n- **Azure Functions** is serverless, usually answered as PaaS when only IaaS/PaaS/SaaS are offered.\n- \"Least administrative effort\" points to **SaaS or PaaS**, \"most control\" to **IaaS**.\n- \"Migrate with no code change\" = **IaaS** (lift and shift).", "cues": "", "quiz": [{"k": "S", "q": "A company needs to run a legacy application that requires a specific OS configuration and cannot be changed. Which service type is the best fit?", "o": [{"t": "IaaS", "w": "Provides VMs where you control the OS and software.", "c": true}, {"t": "PaaS", "w": "Managed runtimes restrict OS-level customization.", "c": false}, {"t": "SaaS", "w": "You cannot install your own legacy app on a finished product.", "c": false}, {"t": "Serverless", "w": "Event-driven code model, not for legacy OS-bound apps.", "c": false}]}, {"k": "S", "q": "Which is an example of SaaS?", "o": [{"t": "Azure Virtual Machines", "w": "IaaS.", "c": false}, {"t": "Azure App Service", "w": "PaaS.", "c": false}, {"t": "Microsoft 365", "w": "A complete application managed by the provider.", "c": true}, {"t": "Azure Virtual Network", "w": "A networking building block (IaaS-level).", "c": false}]}, {"k": "D", "q": "Developers want to deploy a web API without managing servers or patching the OS. They should use {0}. A team lifting a legacy server unchanged should choose {1}.", "slots": [[{"t": "IaaS", "w": "You would still own the OS.", "c": false}, {"t": "PaaS (App Service)", "w": "The platform manages OS and runtime.", "c": true}, {"t": "SaaS", "w": "You cannot deploy custom APIs on a finished product.", "c": false}], [{"t": "IaaS", "w": "Lift and shift maps to VMs.", "c": true}, {"t": "PaaS", "w": "Typically needs code or config changes.", "c": false}, {"t": "SaaS", "w": "Not a way to host your own server.", "c": false}]]}, {"k": "O", "q": "Order the service types from MOST customer responsibility to LEAST.", "steps": ["On-premises datacenter", "IaaS", "PaaS", "SaaS"], "w": "Responsibility shifts to Microsoft at every step to the right."}, {"k": "Y", "q": "Contoso hosts SQL Server on an Azure VM and Fabrikam uses Azure SQL Database.", "st": [{"t": "Contoso is responsible for patching the OS.", "a": true, "w": "SQL Server on a VM is IaaS."}, {"t": "Fabrikam must patch the database host OS.", "a": false, "w": "Azure SQL Database is PaaS and Microsoft patches it."}, {"t": "Both customers remain responsible for their data.", "a": true, "w": "Data is always the customer's."}]}]}, {"id": "f04", "title": "Describe the core architectural components of Azure", "terms": [["Datacenter", "A physical facility with servers, storage, networking, power and cooling. Customers never choose a datacenter, only a region or zone."], ["Region", "A geographic area containing one or more datacenters connected by a low-latency network. You pick a region when creating most resources (for example East US, West Europe)."], ["Geography", "A data-residency and compliance boundary (country or area) that contains one or more regions."], ["Region pair", "Two regions in the same geography, typically hundreds of miles apart (at least 300 miles where possible), paired for disaster recovery. Platform updates are rolled out to one region of a pair at a time, and one region of each pair is prioritised for recovery in a broad outage."], ["Sovereign region", "An isolated Azure instance for compliance or legal needs, such as Azure Government (US) and Azure operated by 21Vianet (China)."], ["Availability zone (AZ)", "A physically separate location within a region with its own power, cooling and networking. Enabled regions have at least three zones."], ["Zone-redundant service", "Replicates automatically across zones (for example ZRS storage, zone-redundant gateways)."], ["Zonal service", "You pin a resource to one specific zone (for example a VM in zone 2)."], ["Resource", "A manageable item in Azure: VM, storage account, virtual network, web app and so on."], ["Resource group (RG)", "A logical container for related resources that share a lifecycle. Every resource lives in exactly one RG."], ["Subscription", "A unit of billing and access control, and a boundary for quotas and limits. Linked to one Microsoft Entra tenant."], ["Management group", "A container above subscriptions used to apply Azure Policy and RBAC to many subscriptions at once."], ["Tenant root group", "The top management group of a Microsoft Entra tenant."], ["Azure Resource Manager (ARM)", "The deployment and management layer that every portal, CLI, PowerShell and API request goes through."], ["Scope", "The level at which policy or access applies: management group, subscription, resource group or resource."]], "fc": [["Minimum availability zones per enabled region", "Three."], ["Region pair distance", "Typically at least 300 miles apart."], ["Order of hierarchy", "Management group > subscription > resource group > resource."], ["Can a resource group contain another resource group?", "No."], ["Sovereign region examples", "Azure Government and Azure operated by 21Vianet (China)."], ["What happens when you delete a resource group?", "All resources inside are deleted."], ["Management group nesting depth", "Up to 6 levels (excluding root and subscription)."]], "how": "### Physical layout\nDatacenters are grouped into **regions**. Most regions expose **availability zones**. Two regions in the same geography are a **region pair**.\n\n- **Region choice** affects latency, price, available services and data residency.\n- **Availability zones** protect against a datacenter failure inside a region.\n- **Region pairs** protect against a whole region failure (used by geo-redundant storage, Site Recovery and others).\n- **Sovereign regions** are physically and logically isolated for government or national compliance.\n\n### Logical layout (the hierarchy)\nTenant root group → **Management groups** → **Subscriptions** → **Resource groups** → **Resources**.\n\n- Policy and role assignments **inherit downward**.\n- A subscription has one parent; management groups can nest (up to 6 levels below the root).\n- A resource group is not a security boundary by itself, but it is a convenient scope for access, tags, locks and delete.\n\n### Resource groups: rules to remember\n- A resource belongs to **one** RG at a time (it can be moved).\n- RGs **cannot be nested**.\n- Resources in an RG can be in different regions from the RG itself.\n- **Deleting an RG deletes everything in it.**\n- The RG location only stores its metadata.\n\n### Why multiple subscriptions?\nSeparate environments (prod/dev), separate billing owners, isolate quotas, and separate access boundaries.", "lim": "| Concept | Key facts |\n|---|---|\n| Availability zones | 3 or more per enabled region, separate power, cooling, network |\n| Region pair | Same geography, usually 300+ miles apart, sequential updates |\n| Management group depth | Up to 6 levels (not counting root or subscription level) |\n| Management group parent | Each group or subscription has exactly one parent |\n| RG nesting | Not supported |\n| Subscription | Billing and access boundary, tied to one Entra tenant |\n\n| Redundancy tool | Protects against |\n|---|---|\n| Availability zones | Datacenter failure |\n| Region pairs | Region failure |\n| Availability sets | Rack and maintenance failure inside one datacenter |", "exam": "- Define region, region pair, sovereign region, availability zone, datacenter and the hierarchy.\n- Choose between **availability zones** (inside a region) and **region pairs** (across regions) for a scenario.\n- Know the order: management group → subscription → resource group → resource.\n- Know that policy and RBAC **inherit** and that deleting an RG deletes its resources.\n- Know examples of sovereign regions (Azure Government, Azure China).", "stress": "- **AZ ≠ region pair.** AZs are inside one region; pairs are two regions.\n- **A resource lives in exactly one resource group.** RGs cannot be nested.\n- **Not every region has availability zones.** Not every service is zone-redundant.\n- **Management groups hold subscriptions, not resource groups.**\n- **Region pairs** get sequential updates and one region per pair is prioritised for recovery.\n- **Subscription = billing and access boundary**, not a network boundary.\n- Choosing a region closer to users reduces latency; data residency may force a specific geography.", "cues": "### CLI\n```\naz group create --name rg-demo --location westeurope\naz group delete --name rg-demo --yes\naz account list-locations -o table\n```\n### PowerShell\n```\nNew-AzResourceGroup -Name rg-demo -Location westeurope\nRemove-AzResourceGroup -Name rg-demo -Force\n```", "quiz": [{"k": "S", "q": "A solution must stay available if an entire datacenter in a region fails, with the lowest complexity. What should you use?", "o": [{"t": "A region pair", "w": "Cross-region protection is more than needed and adds complexity.", "c": false}, {"t": "Availability zones", "w": "Physically separate datacenters inside the same region.", "c": true}, {"t": "A larger VM size", "w": "Does not remove the single point of failure.", "c": false}, {"t": "A second subscription", "w": "Subscriptions are billing and access boundaries, not redundancy.", "c": false}]}, {"k": "S", "q": "Which statement about resource groups is true?", "o": [{"t": "A resource can belong to two resource groups.", "w": "Each resource has exactly one RG.", "c": false}, {"t": "Deleting a resource group deletes all resources in it.", "w": "This is a common clean-up approach and a common mistake.", "c": true}, {"t": "Resource groups can be nested up to six levels.", "w": "Management groups nest; resource groups do not.", "c": false}, {"t": "Resources must be in the same region as their resource group.", "w": "They can be in different regions.", "c": false}]}, {"k": "O", "q": "Order the Azure hierarchy from the top level to the lowest level.", "steps": ["Management group", "Subscription", "Resource group", "Resource"], "w": "Policy and RBAC assigned higher up inherit down this chain."}, {"k": "M", "q": "Which TWO are valid reasons to create multiple subscriptions?", "o": [{"t": "Separate billing for production and development", "w": "Subscriptions are the billing boundary.", "c": true}, {"t": "Isolate quotas and access for different teams", "w": "Limits and RBAC can be scoped per subscription.", "c": true}, {"t": "To place resources in different regions", "w": "Region is chosen per resource, not per subscription.", "c": false}, {"t": "To nest resource groups", "w": "Nesting is not supported.", "c": false}]}, {"k": "Y", "q": "Contoso wants to apply one policy to all of its subscriptions.", "st": [{"t": "It can create a management group, move the subscriptions into it, and assign the policy there.", "a": true, "w": "Policy assigned at a management group is inherited by child subscriptions."}, {"t": "A management group can contain resource groups directly.", "a": false, "w": "Management groups contain subscriptions and other management groups."}, {"t": "Azure Government is a sovereign region.", "a": true, "w": "It is an isolated instance for US government workloads."}]}]}, {"id": "f05", "title": "Describe Azure compute and networking services", "terms": [["Virtual machine (VM)", "IaaS compute with full control of the OS. Size (vCPU, RAM) is chosen at creation and can be changed later."], ["Virtual Machine Scale Sets (VMSS)", "A group of identical, load-balanced VMs that can scale out and in automatically based on rules or schedule."], ["Availability set", "Groups VMs across fault domains (power/network) and update domains (planned maintenance) within one datacenter. Protects against rack-level and maintenance events."], ["Azure Virtual Desktop (AVD)", "Cloud desktop and app virtualization service. Supports multi-session Windows 11 and Windows 10 desktops."], ["Container", "A lightweight, portable package of an app and its dependencies that shares the host OS kernel."], ["Azure Container Instances (ACI)", "Run containers without managing servers or an orchestrator. Fastest, simplest."], ["Azure Kubernetes Service (AKS)", "Managed Kubernetes for orchestrating many containers at scale."], ["Azure Container Apps", "Serverless container platform built on Kubernetes concepts, with scale-to-zero and event-driven scaling."], ["Azure Functions", "Serverless event-driven code. Pay per execution on the Consumption plan."], ["Azure App Service", "PaaS for web apps, APIs, mobile backends and WebJobs. Supports multiple languages with built-in scaling, slots and TLS."], ["Virtual network (VNet)", "Your private, isolated network in Azure. You define an address space (CIDR) and subnets."], ["Subnet", "A range of IP addresses inside a VNet."], ["VNet peering", "Connects two VNets (same or different regions) over the Microsoft backbone, with low latency. Not transitive by default."], ["Azure DNS", "Hosts DNS zones and resolves names using Microsoft's global name servers."], ["VPN Gateway", "Sends encrypted traffic over the public internet between a VNet and on-premises (site-to-site) or a single client (point-to-site)."], ["ExpressRoute", "A private, dedicated connection from on-premises to Azure through a connectivity provider. It does not travel over the public internet."], ["Public endpoint", "A service reachable through a public IP over the internet."], ["Private endpoint", "A network interface with a private IP in your VNet that connects you privately to an Azure PaaS service through Azure Private Link."], ["Azure Private Link", "The technology that exposes a service over a private endpoint."], ["NIC (network interface card)", "Connects a VM to a virtual network. Holds IPs and NSG association."]], "fc": [["ExpressRoute travels over", "A private connection, not the public internet."], ["VPN Gateway traffic is", "Encrypted and sent over the public internet."], ["Availability set protects against", "Rack-level and planned maintenance failures in one datacenter."], ["VMSS purpose", "Identical VMs with autoscaling and load balancing."], ["Resources needed for a VM", "OS disk, NIC, virtual network and subnet (plus optional public IP, NSG, data disks)."], ["Private endpoint gives", "A private IP in your VNet for an Azure PaaS service."], ["VNet peering is transitive?", "No."], ["Simplest Azure container service", "Azure Container Instances."]], "how": "### Compute types\n| Type | You manage | Typical use |\n|---|---|---|\n| VM (IaaS) | OS, patches, apps | Lift and shift, custom software |\n| Containers | The container image | Portable microservices |\n| Functions (serverless) | Only the code | Event-driven, short tasks |\n\n### Virtual machine options\n- **Single VM**: SLA depends on disk type (Premium SSD gets the highest single-VM SLA).\n- **Availability set**: spread across fault and update domains (99.95% SLA).\n- **Availability zones**: spread across datacenters (99.99% SLA).\n- **VMSS**: many identical VMs with autoscale (good for stateless web tiers).\n- **Azure Virtual Desktop**: users connect to Windows desktops hosted in Azure.\n\n### What a VM needs\nA VM itself plus an **OS disk**, a **NIC**, a **virtual network and subnet**, and optionally data disks, a public IP and an NSG. Deleting a VM does not always delete its disks, NICs and public IPs (they can remain and keep costing money).\n\n### Hosting an app: which option?\n- **App Service**: just deploy code. Platform handles OS and scaling.\n- **Containers**: packaged apps, portability. ACI (simple), Container Apps (serverless), AKS (full orchestration).\n- **VMs**: when you need OS control.\n\n### Networking\n- Every VNet is isolated by default. Resources in the same VNet can talk to each other and to the internet outbound by default.\n- **Peering** joins VNets privately. **VPN Gateway** or **ExpressRoute** joins Azure to on-premises.\n- **Azure DNS** provides name resolution for your own domains.\n- **Private endpoints** bring a PaaS service into your VNet with a private IP so traffic never crosses the public internet.", "lim": "| | VPN Gateway | ExpressRoute |\n|---|---|---|\n| Path | Public internet (encrypted tunnel) | Private provider circuit |\n| Encrypted by default | Yes (IPsec/IKE) | No (add MACsec or VPN if needed) |\n| Bandwidth | Up to several Gbps | Up to 100 Gbps |\n| Latency and reliability | Variable | Predictable, lower latency |\n| Cost and setup | Lower, quick | Higher, needs a provider |\n\n| Container option | Orchestration | Scale to zero | Best for |\n|---|---|---|---|\n| ACI | None | Pay while running | Simple, bursty jobs |\n| Container Apps | Built in (abstracted) | Yes | Microservices without managing Kubernetes |\n| AKS | Full Kubernetes | Node pools | Large scale, full control |\n\n| Availability option | Protects against | Typical SLA |\n|---|---|---|\n| Single VM with Premium SSD | Nothing extra | 99.9% |\n| Availability set | Rack and maintenance | 99.95% |\n| Availability zones | Datacenter failure | 99.99% |", "exam": "- Compare containers, VMs and Functions for a scenario.\n- Pick VM, scale set, availability set or Azure Virtual Desktop from a requirement.\n- List the resources needed to deploy a VM (disk, NIC, VNet).\n- Choose between App Service, containers and VMs for hosting.\n- Know the purpose of VNet, subnet, peering, DNS, VPN Gateway and ExpressRoute.\n- Define public vs private endpoints.", "stress": "- **ExpressRoute is private but not encrypted by default.** VPN Gateway is encrypted but crosses the internet.\n- **Peering is not transitive**: A↔B and B↔C does not give A↔C.\n- **Availability set** = one datacenter. **Availability zones** = multiple datacenters. Do not mix them up.\n- **Private endpoint** = private IP in your VNet. **Service endpoint** (AZ-104) = optimised route to the service's public endpoint.\n- **VMSS** is for identical VMs that scale; **availability sets** are for fault tolerance of a fixed set.\n- **Azure Virtual Desktop** is multi-session capable; a normal VM is not.\n- **Functions** are serverless, **App Service** is PaaS with always-on plans. Choose Functions for event-driven short tasks.\n- ACI = simplest containers, AKS = full orchestration.", "cues": "", "quiz": [{"k": "S", "q": "A company needs encrypted connectivity between its on-premises network and an Azure VNet, using existing internet connections and minimising cost. What should it use?", "o": [{"t": "ExpressRoute", "w": "Requires a provider circuit, costs more, and is not encrypted by default.", "c": false}, {"t": "VPN Gateway", "w": "IPsec/IKE encrypted tunnel over the internet at low cost.", "c": true}, {"t": "VNet peering", "w": "Connects Azure VNets, not on-premises networks.", "c": false}, {"t": "Azure DNS", "w": "Name resolution only.", "c": false}]}, {"k": "S", "q": "You want to run a short-lived container without managing servers or Kubernetes. Which service?", "o": [{"t": "Azure Container Instances", "w": "Fastest, simplest way to run a container.", "c": true}, {"t": "Azure Kubernetes Service", "w": "Full orchestration, more than needed.", "c": false}, {"t": "Azure Virtual Desktop", "w": "Hosts desktops, not containers.", "c": false}, {"t": "Availability set", "w": "Not a container service.", "c": false}]}, {"k": "M", "q": "Which TWO resources are required to deploy a basic Azure VM?", "o": [{"t": "A virtual network and subnet", "w": "The NIC must connect to a subnet.", "c": true}, {"t": "An OS disk", "w": "Every VM boots from an OS disk.", "c": true}, {"t": "A public IP address", "w": "Optional.", "c": false}, {"t": "An ExpressRoute circuit", "w": "Only for on-premises connectivity.", "c": false}]}, {"k": "D", "q": "To protect VMs against a datacenter failure inside one region you use {0}. To connect a VNet privately to Azure SQL Database with a private IP you use a {1}.", "slots": [[{"t": "an availability set", "w": "Only protects within one datacenter.", "c": false}, {"t": "availability zones", "w": "Separate datacenters in a region.", "c": true}, {"t": "VNet peering", "w": "Network connectivity feature.", "c": false}], [{"t": "VPN Gateway", "w": "Connects networks, not PaaS services.", "c": false}, {"t": "private endpoint", "w": "Gives the service a private IP in your VNet.", "c": true}, {"t": "public endpoint", "w": "Reachable over the internet.", "c": false}]]}, {"k": "Y", "q": "VNet A is peered with VNet B, and VNet B is peered with VNet C. No other connections exist.", "st": [{"t": "VMs in VNet A can reach VMs in VNet C through VNet B by default.", "a": false, "w": "Peering is not transitive."}, {"t": "Traffic between A and B uses the Microsoft backbone, not the public internet.", "a": true, "w": "Peering uses private backbone."}, {"t": "VNets must be in the same region to peer.", "a": false, "w": "Global VNet peering supports different regions."}]}]}, {"id": "f06", "title": "Describe Azure storage services", "terms": [["Storage account", "A top-level Azure Storage container with a unique name that gives you a namespace for blobs, files, queues and tables."], ["Azure Blob Storage", "Object storage for unstructured data (documents, images, video, backups, logs). Block, append and page blobs."], ["Azure Files", "Managed file shares reachable over SMB and NFS (and REST)."], ["Azure Queue Storage", "Simple message queue for decoupling app components. Messages up to 64 KB."], ["Azure Table Storage", "NoSQL key-attribute store for structured, non-relational data."], ["Azure Disk Storage", "Managed block-level disks for VMs."], ["Access tier", "Hot, Cool, Cold or Archive. Trades storage cost against access cost."], ["Hot tier", "Frequently accessed data. Highest storage cost, lowest access cost."], ["Cool tier", "Infrequently accessed, kept at least 30 days."], ["Cold tier", "Rarely accessed, kept at least 90 days."], ["Archive tier", "Rarely accessed, kept at least 180 days. Offline: must be rehydrated before reading (hours)."], ["LRS (locally redundant)", "Three copies in a single datacenter in one region."], ["ZRS (zone-redundant)", "Three copies across three availability zones in one region."], ["GRS (geo-redundant)", "LRS in the primary region plus asynchronous copy (LRS) to the paired secondary region."], ["GZRS (geo-zone-redundant)", "ZRS in the primary region plus asynchronous copy to the secondary region."], ["RA-GRS / RA-GZRS", "Same as GRS/GZRS but the secondary is readable at any time."], ["AzCopy", "Command-line tool for copying data to and from storage accounts."], ["Azure Storage Explorer", "Free GUI app to manage storage accounts and data."], ["Azure File Sync", "Syncs on-premises Windows Server file shares with Azure Files, with optional cloud tiering."], ["Azure Migrate", "Central hub to discover, assess and migrate on-premises servers, databases and apps to Azure."], ["Azure Data Box", "Physical appliances shipped to you for offline bulk data transfer into Azure."]], "fc": [["Cool tier minimum retention", "30 days."], ["Cold tier minimum retention", "90 days."], ["Archive tier minimum retention", "180 days, and it is offline."], ["LRS keeps", "Three copies in a single datacenter."], ["ZRS keeps", "Three copies across three availability zones."], ["GRS adds", "An asynchronous copy to the paired region (not readable unless RA-GRS)."], ["Azure File Sync purpose", "Sync on-premises Windows Server file shares with Azure Files."], ["Azure Migrate purpose", "Discover, assess and migrate servers, databases and apps."]], "how": "### The services in one view\n| Service | Data type | Typical use |\n|---|---|---|\n| Blob | Unstructured objects | Media, backups, data lakes, static sites |\n| Files | File shares (SMB/NFS) | Lift and shift file servers, shared config |\n| Queue | Messages | Decoupling workers |\n| Table | NoSQL key/value rows | Simple structured data |\n| Disk | Block volumes | VM OS and data disks |\n\n### Redundancy: copies and where\n- **LRS**: cheapest, protects against disk/rack failure only.\n- **ZRS**: protects against a datacenter (zone) outage.\n- **GRS/GZRS**: protects against a regional outage. Secondary is not readable unless you choose RA.\n- Failover to the secondary is a deliberate action (customer-managed failover) unless Microsoft declares a region disaster.\n\n### Tiers: pay less to store, more to access\nMove old data from Hot to Cool, Cold, then Archive. Archive is cheapest to store but must be rehydrated (hours) before you can read it.\n\n### Moving data\n- **AzCopy**: scripted, fast, command line.\n- **Storage Explorer**: visual, ad hoc.\n- **Azure File Sync**: continuous sync between on-premises Windows Servers and Azure Files.\n- **Azure Migrate**: whole workloads (servers, databases, web apps).\n- **Azure Data Box**: very large data sets where network transfer would take too long (disks or appliances shipped back to Microsoft).", "lim": "| Option | Copies | Scope | Approx. durability |\n|---|---|---|---|\n| LRS | 3 | One datacenter | 11 nines |\n| ZRS | 3 | Three zones in one region | 12 nines |\n| GRS | 6 | Primary LRS + secondary LRS | 16 nines |\n| GZRS | 6 | Primary ZRS + secondary LRS | 16 nines |\n\n| Tier | Min retention | Access latency | Storage cost |\n|---|---|---|---|\n| Hot | None | Milliseconds | Highest |\n| Cool | 30 days | Milliseconds | Lower |\n| Cold | 90 days | Milliseconds | Lower still |\n| Archive | 180 days | Hours (rehydrate) | Lowest |\n\n| Transfer need | Choose |\n|---|---|\n| Script copy to a storage account | AzCopy |\n| Visual drag and drop | Storage Explorer |\n| Keep on-prem file server synced | Azure File Sync |\n| Move servers and databases | Azure Migrate |\n| Hundreds of TB offline | Azure Data Box |", "exam": "- Match data type to service: blob, files, queue, table, disk.\n- Choose a redundancy option from a requirement (zone failure vs region failure vs readable secondary).\n- Choose the access tier for a data access pattern, and know Archive is offline.\n- Select the right migration or transfer tool.", "stress": "- **Archive tier is offline.** You must rehydrate before you can read; it takes hours.\n- **Cool / Cold / Archive have minimum retention** (30 / 90 / 180 days). Early deletion carries a charge.\n- **GRS secondary is not readable** unless you use RA-GRS or RA-GZRS.\n- **ZRS protects against a zone failure, not a regional failure.** For region failure you need GRS or GZRS.\n- **Azure File Sync** is for on-premises Windows Server. AzCopy is a copy tool, not a sync service.\n- **Data Box is offline.** If the question says \"limited bandwidth, tens or hundreds of TB\", choose it.\n- **Queue** messages are small (64 KB). Large objects belong in Blob.", "cues": "### CLI\n```\naz storage account create -n stdemo123 -g rg-demo -l westeurope --sku Standard_GRS --kind StorageV2\naz storage blob upload --account-name stdemo123 -c data -f ./a.txt -n a.txt\n```\n### AzCopy\n```\nazcopy copy \"C:\\data\" \"https://stdemo123.blob.core.windows.net/data?<SAS>\" --recursive\n```", "quiz": [{"k": "S", "q": "Which service provides managed SMB file shares that can be mounted from VMs and on-premises?", "o": [{"t": "Azure Blob Storage", "w": "Object storage, not mounted as an SMB share in the standard sense.", "c": false}, {"t": "Azure Files", "w": "Managed SMB and NFS file shares.", "c": true}, {"t": "Azure Queue Storage", "w": "Messaging.", "c": false}, {"t": "Azure Table Storage", "w": "NoSQL tables.", "c": false}]}, {"k": "S", "q": "Data must survive the loss of an entire region and the secondary must be readable. Which redundancy?", "o": [{"t": "ZRS", "w": "Protects zones within one region only.", "c": false}, {"t": "GRS", "w": "Secondary is not readable.", "c": false}, {"t": "RA-GRS", "w": "Geo-replicated with a read-access secondary.", "c": true}, {"t": "LRS", "w": "Single datacenter.", "c": false}]}, {"k": "D", "q": "Old compliance records are rarely read and may take hours to retrieve. Use the {0} tier. A company with 300 TB and slow internet should use {1}.", "slots": [[{"t": "Hot", "w": "Highest storage cost.", "c": false}, {"t": "Cool", "w": "Retrieval is immediate, storage cost higher than Archive.", "c": false}, {"t": "Archive", "w": "Lowest cost, offline, rehydration required.", "c": true}], [{"t": "AzCopy", "w": "Still depends on network bandwidth.", "c": false}, {"t": "Azure Data Box", "w": "Physical offline transfer.", "c": true}, {"t": "Azure File Sync", "w": "Syncs files over the network.", "c": false}]]}, {"k": "M", "q": "Which TWO tools help move files to Azure Storage?", "o": [{"t": "AzCopy", "w": "Command-line copy to and from storage.", "c": true}, {"t": "Azure Storage Explorer", "w": "GUI for uploading and managing data.", "c": true}, {"t": "Azure Advisor", "w": "Gives recommendations, does not move data.", "c": false}, {"t": "Azure Policy", "w": "Governance, not data transfer.", "c": false}]}, {"k": "Y", "q": "A company stores backups in Blob Storage.", "st": [{"t": "Moving a blob from Archive to Hot makes it immediately readable.", "a": false, "w": "Rehydration takes hours."}, {"t": "ZRS protects data if one availability zone fails.", "a": true, "w": "Copies live in three zones."}, {"t": "Queue Storage is the best place for 500 MB video files.", "a": false, "w": "Queues hold small messages; use Blob."}]}]}, {"id": "f07", "title": "Describe Azure identity, access, and security", "terms": [["Identity", "Something that can be authenticated: a user, group, device, application or service principal."], ["Authentication (AuthN)", "Proving who you are."], ["Authorization (AuthZ)", "Deciding what you may do."], ["Microsoft Entra ID", "Microsoft's cloud-based identity and access management service (formerly Azure Active Directory)."], ["Microsoft Entra Domain Services", "Managed domain services (domain join, LDAP, Kerberos/NTLM, Group Policy) without running your own domain controllers in Azure."], ["Microsoft Entra Connect", "Synchronises on-premises Active Directory identities to Entra ID."], ["Single sign-on (SSO)", "Sign in once and access multiple apps without re-entering credentials."], ["Multifactor authentication (MFA)", "Requires two or more factors: something you know, have, or are."], ["Passwordless authentication", "Replaces passwords with Windows Hello for Business, Microsoft Authenticator or FIDO2 security keys."], ["External identities", "Lets people outside your organization (partners, customers) access your apps with their own identities. B2B collaboration adds guest users."], ["Conditional Access", "Policy engine that evaluates signals (user, location, device, app, risk) and enforces decisions (allow, require MFA, block)."], ["Azure role-based access control (RBAC)", "Authorization for Azure resources using role assignments (who, role, scope)."], ["Role assignment", "Security principal + role definition + scope."], ["Zero Trust", "Security model: verify explicitly, use least privilege access, assume breach."], ["Defense in depth", "Layered security so a failure of one layer does not expose everything."], ["Microsoft Defender for Cloud", "Cloud security posture management (CSPM) and workload protection (CWPP) across Azure, hybrid and multicloud."], ["Secure Score", "Defender for Cloud measure of your security posture."]], "fc": [["Authentication vs authorization", "Who you are vs what you may do."], ["Entra Domain Services provides", "Managed domain join, LDAP, Kerberos, NTLM and Group Policy."], ["Passwordless examples", "Windows Hello for Business, Microsoft Authenticator, FIDO2 keys."], ["Role that can assign roles (broad)", "Owner (and User Access Administrator)."], ["Zero Trust principles", "Verify explicitly, least privilege, assume breach."], ["Defense in depth layers", "Physical, identity and access, perimeter, network, compute, application, data."], ["Conditional Access model", "If signals match, then enforce a decision."], ["Defender for Cloud gives", "Secure Score, recommendations and threat protection."]], "how": "### Entra ID vs Entra Domain Services vs on-premises AD\n| | Entra ID | Entra Domain Services | AD DS on-prem |\n|---|---|---|---|\n| Protocols | OAuth, OpenID Connect, SAML | LDAP, Kerberos, NTLM | LDAP, Kerberos, NTLM |\n| Who runs DCs | Microsoft | Microsoft (managed) | You |\n| Use | Cloud and SaaS sign-in | Legacy apps that need domain join | Traditional environment |\n\n### Authentication methods\n- **SSO**: one identity for many apps, fewer passwords.\n- **MFA**: blocks most password-only attacks.\n- **Passwordless**: the strongest and easiest for users.\n\n### External identities\nInvite partners as **guest** users (B2B) so they use their own credentials. Entra External ID also covers customer-facing apps.\n\n### Conditional Access\nIf-then rules: **if** the user signs in from an unknown location **then** require MFA. Signals in, decisions out. Requires Entra ID P1 or higher.\n\n### RBAC\nAssign a **role** to a **principal** at a **scope**. Built-in roles: Owner (full access plus assign roles), Contributor (manage resources, cannot assign roles), Reader (view only), User Access Administrator (manage access). Permissions are additive and inherited.\n\n### Zero Trust\nNever trust by default. Verify explicitly, apply least privilege, assume breach.\n\n### Defense in depth layers\nPhysical security → Identity and access → Perimeter → Network → Compute → Application → Data.\n\n### Defender for Cloud\nAssesses resources, gives recommendations, shows Secure Score, and offers threat protection plans per workload.", "lim": "| Role | Manage resources | Assign access |\n|---|---|---|\n| Owner | Yes | Yes |\n| Contributor | Yes | No |\n| Reader | No (view only) | No |\n| User Access Administrator | No | Yes |\n\n| Entra ID tier | Notable features |\n|---|---|\n| Free | Basic user/group management, SSO to many apps |\n| P1 | Conditional Access, dynamic groups, hybrid features |\n| P2 | Identity Protection and Privileged Identity Management |", "exam": "- Distinguish Entra ID from Entra Domain Services.\n- Define SSO, MFA and passwordless and name examples.\n- Describe external identities (B2B guest users).\n- Describe Conditional Access in plain terms (signals and decisions).\n- Describe RBAC, role assignment and inheritance.\n- Define Zero Trust principles and defense in depth layers.\n- State the purpose of Defender for Cloud (posture and prote
